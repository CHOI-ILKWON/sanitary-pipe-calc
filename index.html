<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위생배관 관경 계산서</title>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --surface3:#2a2f47;
  --border:#2e3350; --accent:#4f8ef7; --hot:#e05c8a; --drain:#a07cf7;
  --red:#e05c5c; --accent2:#38c9a0; --warn:#f7a64f; --text:#e8ecf4; --text2:#8892aa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:52px}
.logo{color:var(--accent);font-weight:700;font-size:15px;white-space:nowrap}
#projectName{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:13px;width:200px;font-family:inherit}
#projectName:focus{outline:none;border-color:var(--accent)}
.hbtns{margin-left:auto;display:flex;gap:8px}
.tabs-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;padding:0 16px}
.tab-btn{padding:12px 20px;cursor:pointer;color:var(--text2);border:none;border-bottom:2px solid transparent;font-size:13px;white-space:nowrap;transition:all .15s;background:none;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-pane{display:none;height:calc(100vh - 104px)}
.tab-pane.active{display:flex}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.82}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--accent2);color:#0f1117}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:3px 8px;font-size:11px}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.badge-cw{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.4);color:var(--accent)}
.badge-hw{background:rgba(224,92,138,.15);border:1px solid rgba(224,92,138,.4);color:var(--hot)}
.badge-sew{background:rgba(224,92,92,.15);border:1px solid rgba(224,92,92,.4);color:var(--red)}
.badge-wst{background:rgba(160,124,247,.15);border:1px solid rgba(160,124,247,.4);color:var(--drain)}
.badge-na{background:rgba(136,146,170,.1);border:1px solid rgba(136,146,170,.2);color:var(--text2)}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-hdr{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sidebar-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.zone-card{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative}
.zone-card:hover{background:var(--surface2)}
.zone-card.active{background:var(--surface2);border-left:3px solid var(--accent)}
.zone-card-name{font-size:13px;font-weight:600;margin-bottom:3px}
.zone-card-floor{font-size:11px;color:var(--text2);margin-bottom:6px}
.zone-card-fx{font-size:10px;color:var(--text2);margin-bottom:5px;line-height:1.4}
.zone-card-badges{display:flex;gap:4px;flex-wrap:wrap}
.zone-card-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px;opacity:0;transition:opacity .15s}
.zone-card:hover .zone-card-del{opacity:1}
.zone-card-del:hover{color:var(--red)}
.main-panel{flex:1;overflow:hidden;display:flex;flex-direction:column}
#resultPanel{overflow-y:auto;padding:16px}
.zone-editor-top{padding:10px 16px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border)}
.zone-editor-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.zone-name-inp{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:15px;font-weight:700;font-family:inherit;width:200px}
.zone-name-inp:focus{outline:none;border-color:var(--accent)}
.zone-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip-lbl{color:var(--text2)}
.chip-val{font-weight:600}
/* P&ID Pipe Canvas */
.pipe-canvas{flex:1;overflow:auto;background:var(--bg);position:relative}
.pipe-inner{position:relative}
/* Pipe Nodes */
.pipe-node{
  position:absolute;width:150px;
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:11px;
  transition:border-color .1s;
}
.pipe-both-cols{display:flex;gap:0;margin-top:5px;border-top:1px solid var(--border);padding-top:4px}
.pipe-col{flex:1;min-width:0}
.pipe-col-hdr{font-size:9px;color:var(--text2);margin-bottom:2px;font-weight:600;letter-spacing:.3px}
.pipe-col-div{width:1px;background:var(--border);margin:0 5px;flex-shrink:0}
.pipe-node-start{border-color:var(--accent2)!important}
.pipe-node-junction{border-color:var(--warn)!important}
.pipe-node-fixture{border-color:var(--accent)!important}
.pipe-node-end{border-color:var(--red)!important;border-radius:8px 50% 50% 8px!important}
.pipe-label{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.pipe-sub{font-size:10px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-qty-row{display:flex;align-items:center;gap:3px;margin-top:4px}
.pipe-qty-inp{width:38px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:1px 3px;border-radius:3px;font-size:10px;text-align:center;font-family:inherit}
.pipe-qty-inp:focus{outline:none;border-color:var(--accent)}
.pipe-node-sizes{font-size:9.5px;margin-top:4px;line-height:1.5;display:flex;flex-direction:column;gap:0}
.pipe-del{
  position:absolute;top:3px;right:3px;
  background:none;border:none;color:var(--text2);
  cursor:pointer;font-size:12px;line-height:1;padding:1px;
  opacity:0;transition:opacity .15s;
}
.pipe-node:hover .pipe-del{opacity:1}
.pipe-del:hover{color:var(--red)}
.pipe-add{
  position:absolute;width:26px;height:26px;border-radius:50%;
  background:var(--surface2);border:1.5px dashed var(--border);
  color:var(--text2);cursor:pointer;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;z-index:5;padding:0;font-family:inherit;
}
.pipe-add:hover{background:var(--accent);border-color:var(--accent);color:#fff;border-style:solid}
/* Add-element popup */
.add-popup{
  position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px;z-index:300;
  display:flex;flex-direction:column;gap:3px;min-width:120px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.add-popup-item{
  padding:7px 12px;border-radius:5px;border:none;
  background:none;color:var(--text);cursor:pointer;
  font-size:12px;text-align:left;font-family:inherit;transition:background .1s;
}
.add-popup-item:hover{background:var(--surface2)}
/* Conn / Group layout */
.conn-layout{display:flex;width:100%;height:100%}
.conn-sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.conn-main{flex:1;overflow-y:auto;padding:16px}
.conn-zone-item{padding:8px;border-radius:6px;margin-bottom:4px}
.group-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.group-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.group-name-inp{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;font-family:inherit;font-weight:600;width:150px}
.group-name-inp:focus{outline:none;border-color:var(--accent)}
.zone-check-list{display:flex;flex-direction:column;gap:4px}
.zone-check-item{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:4px;user-select:none}
.zone-check-item:hover{background:var(--surface3)}
.zone-check-item input[type=checkbox]{accent-color:var(--accent)}
.section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.section-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface3);padding:8px 10px;text-align:left;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center}
.result-card-title{font-size:12px;color:var(--text2);margin-bottom:10px}
.result-pipe-big{font-size:38px;font-weight:700}
.result-pipe-sub{font-size:13px;color:var(--text2);margin-top:4px}
.result-pipe-pair{display:flex;gap:16px;justify-content:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;width:320px}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px}
.modal-inp{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:14px;font-family:inherit;margin-bottom:12px}
.modal-inp:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-family:inherit;font-size:12px}
select:focus{outline:none;border-color:var(--accent)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.empty{color:var(--text2);text-align:center;padding:40px 20px;font-size:13px}
.fr{display:flex;align-items:center;gap:8px}
.ml{margin-left:auto}
.mb{margin-bottom:8px}
.fxm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fxm-item{width:100%;text-align:left;padding:7px 10px;font-size:12px}
@media print{
  header,.tabs-bar{display:none!important}
  .tab-pane{display:block!important;height:auto!important;page-break-after:always}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>

<header>
  <span class="logo">⊞ 위생배관 관경 계산서</span>
  <input id="projectName" type="text" placeholder="프로젝트명 입력…">
  <div class="hbtns">
    <button class="btn btn-danger" onclick="resetAll()">🔄 초기화</button>
    <button class="btn btn-success" onclick="saveJSON()">💾 JSON 저장</button>
    <label class="btn btn-ghost" style="cursor:pointer">📂 불러오기<input type="file" accept=".json" style="display:none" onchange="loadJSON(event)"></label>
    <button class="btn btn-ghost" onclick="printPDF()">🖨 PDF 출력</button>
  </div>
</header>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab(0)">① 개별 화장실</button>
  <button class="tab-btn" onclick="switchTab(1)">② 급수/급탕 연결</button>
  <button class="tab-btn" onclick="switchTab(2)">③ 오배수 연결</button>
  <button class="tab-btn" onclick="switchTab(3)">④ MAIN관</button>
  <button class="tab-btn" onclick="switchTab(4)">⑤ 메인관 결과</button>
  <button class="tab-btn" onclick="switchTab(5)">⑥ 압력검토</button>
</div>

<div class="tab-pane active" id="tab0">
  <div class="sidebar" id="zoneSidebar"></div>
  <div class="main-panel" id="zoneEditor"></div>
</div>
<div class="tab-pane" id="tab1">
  <div class="conn-layout">
    <div class="conn-sidebar" id="cwZoneList"></div>
    <div class="conn-main" id="cwMain"></div>
  </div>
</div>
<div class="tab-pane" id="tab2">
  <div class="conn-layout">
    <div class="conn-sidebar" id="drZoneList"></div>
    <div class="conn-main" id="drMain"></div>
  </div>
</div>
<div class="tab-pane" id="tab3">
  <div class="main-panel" id="mainPipePanel"></div>
</div>
<div class="tab-pane" id="tab4">
  <div class="main-panel" id="resultPanel"></div>
</div>
<div class="tab-pane" id="pressurePane"></div>

<div id="modalOverlay" class="modal-overlay" style="display:none"></div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────────
const FX_KEYS = ['wc_v','wc_t','ur_v','ur_t','bas_p','bas_i','shw','bath','sink','cls','fd','wsh'];
const FX = {
  wc_v:  {name:'대변기(세정밸브)', cwQ:15, conn:25, hot:false, dfu:6,  drain:'sew', dc:100},
  wc_t:  {name:'대변기(세정탱크)', cwQ:12, conn:15, hot:false, dfu:6,  drain:'sew', dc:100},
  ur_v:  {name:'소변기(세정밸브)', cwQ:8,  conn:20, hot:false, dfu:4,  drain:'sew', dc:75},
  ur_t:  {name:'소변기(세정탱크)', cwQ:6,  conn:15, hot:false, dfu:4,  drain:'sew', dc:75},
  bas_p: {name:'세면기(공중용)',   cwQ:8,  conn:15, hot:true,  dfu:1,  drain:'wst', dc:40},
  bas_i: {name:'세면기(개인용)',   cwQ:6,  conn:15, hot:true,  dfu:1,  drain:'wst', dc:40},
  shw:   {name:'샤워기',           cwQ:15, conn:15, hot:true,  dfu:2,  drain:'wst', dc:50},
  bath:  {name:'욕조',             cwQ:30, conn:20, hot:true,  dfu:2,  drain:'wst', dc:40},
  sink:  {name:'주방싱크',         cwQ:8,  conn:15, hot:true,  dfu:2,  drain:'wst', dc:50},
  cls:   {name:'청소싱크',         cwQ:10, conn:20, hot:false, dfu:3,  drain:'wst', dc:75},
  fd:    {name:'FD(배수구)',        cwQ:0,  conn:0,  hot:false, dfu:1,  drain:'wst', dc:50},
  wsh:   {name:'세탁기',           cwQ:8,  conn:15, hot:false, dfu:2,  drain:'wst', dc:50},
};

// ── Pipe tables ────────────────────────────────────────────────────────────────
function flowPipe(q){
  if(q<=0)    return 0;
  if(q<=6.7)  return 15;
  if(q<=13.8) return 20;
  if(q<=25.5) return 25;
  if(q<=48)   return 32;
  if(q<=69)   return 40;
  if(q<=129)  return 50;
  if(q<=232)  return 65;
  if(q<=360)  return 80;
  if(q<=700)  return 100;
  if(q<=1200) return 125;
  return 150;
}
function sewPipe(d){
  if(d<=0)   return 0;
  if(d<=160) return 100;
  if(d<=360) return 125;
  if(d<=620) return 150;
  return 200;
}
function wstPipe(d){
  if(d<=0)   return 0;
  if(d<=6)   return 50;
  if(d<=20)  return 75;
  if(d<=160) return 100;
  if(d<=360) return 125;
  if(d<=620) return 150;
  return 200;
}
function ps(p){ return p ? p+'A' : 'N/A' }

// ── Calc (tree-based, used internally) ────────────────────────────────────────
function calcNode(node){
  let cwQ=0,hwQ=0,sewDFU=0,wstDFU=0;
  let mCw=0,mHw=0,mSew=0,mWst=0;
  const fx = node.fixtures||{};
  for(const k of FX_KEYS){
    const n=fx[k]||0; if(!n) continue;
    const f=FX[k];
    cwQ+=f.cwQ*n;
    if(f.hot) hwQ+=f.cwQ*n;
    if(f.drain==='sew'){sewDFU+=f.dfu*n; mSew=Math.max(mSew,f.dc);}
    else               {wstDFU+=f.dfu*n; mWst=Math.max(mWst,f.dc);}
    if(f.cwQ>0) mCw=Math.max(mCw,f.conn);
    if(f.hot)   mHw=Math.max(mHw,f.conn);
  }
  const kids=(node.children||[]).map(c=>calcNode(c));
  for(const c of kids){
    cwQ+=c.cwQ; hwQ+=c.hwQ; sewDFU+=c.sewDFU; wstDFU+=c.wstDFU;
    mCw=Math.max(mCw,c.cwPipe); mHw=Math.max(mHw,c.hwPipe);
    mSew=Math.max(mSew,c.sewPipe); mWst=Math.max(mWst,c.wstPipe);
  }
  return {
    cwQ, hwQ, sewDFU, wstDFU, kids, node,
    cwPipe:  cwQ>0  ? Math.max(flowPipe(cwQ), mCw)          : 0,
    hwPipe:  hwQ>0  ? Math.max(flowPipe(hwQ), mHw)          : 0,
    sewPipe: sewDFU>0? Math.max(sewPipe(sewDFU), mSew, 100) : 0,
    wstPipe: wstDFU>0? Math.max(wstPipe(wstDFU),mWst, 50)  : 0,
  };
}

// ── Pipe graph → calc tree conversion ─────────────────────────────────────────
function pipeToCalcNode(id, nodes){
  if(!id||!nodes[id]) return {fixtures:Object.fromEntries(FX_KEYS.map(k=>[k,0])),children:[]};
  const n=nodes[id];
  const fixtures=Object.fromEntries(FX_KEYS.map(k=>[k,0]));
  if(n.type==='fixture'&&n.fxKey) fixtures[n.fxKey]=n.qty||1;
  const children=[];
  if(n.mainNext) children.push(pipeToCalcNode(n.mainNext,nodes));
  if(n.branchNext) children.push(pipeToCalcNode(n.branchNext,nodes));
  return {id:n.id, fixtures, children};
}

function calcZone(z){
  return calcNode(pipeToCalcNode(z.pipe.rootId, z.pipe.nodes));
}

function zoneFxTotals(z){
  const t=Object.fromEntries(FX_KEYS.map(k=>[k,0]));
  function walk(id){
    if(!id||!z.pipe.nodes[id]) return;
    const n=z.pipe.nodes[id];
    if(n.type==='fixture'&&n.fxKey) t[n.fxKey]=(t[n.fxKey]||0)+(n.qty||1);
    walk(n.mainNext); walk(n.branchNext);
  }
  walk(z.pipe.rootId);
  return t;
}

function zoneFxSummaryCard(z){
  const t=zoneFxTotals(z);
  const groups=[
    {lbl:'대변기', keys:['wc_v','wc_t']},
    {lbl:'소변기', keys:['ur_v','ur_t']},
    {lbl:'세면기', keys:['bas_p','bas_i']},
    {lbl:'샤워기', keys:['shw']},
    {lbl:'욕조',   keys:['bath']},
    {lbl:'주방싱크',keys:['sink']},
    {lbl:'청소싱크',keys:['cls']},
    {lbl:'FD',     keys:['fd']},
    {lbl:'세탁기', keys:['wsh']},
  ];
  return groups.map(g=>{const n=g.keys.reduce((s,k)=>s+(t[k]||0),0);return n?g.lbl+' '+n:'';}).filter(Boolean).join(' · ')||null;
}

// ── Simultaneous use factors ───────────────────────────────────────────────────
function sewSimult(cnt){
  if(cnt<=2)  return 1.0; if(cnt<=5)  return 0.8; if(cnt<=10) return 0.7;
  if(cnt<=20) return 0.6; if(cnt<=30) return 0.55; return 0.5;
}
function wstSimult(cnt){
  if(cnt<=3) return 1.0; if(cnt<=6) return 0.8; if(cnt<=10) return 0.7;
  if(cnt<=20) return 0.65; return 0.6;
}

// ── Floor calc (no simultaneous factor — same floor) ──────────────────────────
function calcFloor(floor, type){
  const zs=floor.zoneIds.map(id=>S.zones.find(z=>z.id===id)).filter(Boolean);
  let cwQ=0,hwQ=0,sD=0,wD=0;
  for(const z of zs){const r=calcZone(z);cwQ+=r.cwQ;if(!z.elecHW)hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;}
  return {cwQ,hwQ,sewDFU:sD,wstDFU:wD,
    cwPipe:flowPipe(cwQ),hwPipe:flowPipe(hwQ),
    sewPipe:sD>0?Math.max(sewPipe(sD),100):0,
    wstPipe:wD>0?Math.max(wstPipe(wD),50):0, cnt:zs.length};
}

// ── Riser calc (floors + direct zones, with simultaneous factor) ──────────────
function calcRiser(riser, type){
  const floors=riser.floorIds.map(id=>S[type].floors.find(f=>f.id===id)).filter(Boolean);
  const zones=riser.zoneIds.map(id=>S.zones.find(z=>z.id===id)).filter(Boolean);
  let cwQ=0,hwQ=0,sD=0,wD=0,sewCnt=0,wstCnt=0;
  for(const fl of floors){
    const r=calcFloor(fl,type); cwQ+=r.cwQ;hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;
    for(const zid of fl.zoneIds){
      const z=S.zones.find(z=>z.id===zid);if(!z)continue;
      const t=zoneFxTotals(z);
      for(const k of FX_KEYS){ if(FX[k].drain==='sew')sewCnt+=t[k]||0; else wstCnt+=t[k]||0; }
    }
  }
  for(const z of zones){
    const r=calcZone(z);cwQ+=r.cwQ;if(!z.elecHW)hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;
    const t=zoneFxTotals(z);
    for(const k of FX_KEYS){ if(FX[k].drain==='sew')sewCnt+=t[k]||0; else wstCnt+=t[k]||0; }
  }
  const items=floors.length+zones.length;
  // 동시사용률은 MAIN관에서만 적용 (CW/HW)
  const sf=sewSimult(sewCnt),wf=wstSimult(wstCnt);
  sD*=sf; wD*=wf;
  return {cwQ,hwQ,sewDFU:sD,wstDFU:wD,
    cwPipe:flowPipe(cwQ),hwPipe:flowPipe(hwQ),
    sewPipe:sD>0?Math.max(sewPipe(sD),100):0,
    wstPipe:wD>0?Math.max(wstPipe(wD),50):0,
    cnt:items,sewSimult:sf,wstSimult:wf};
}

// ── Zone IDs already allocated (anywhere in the hierarchy for a type) ─────────
function allAssignedZoneIds(type){
  const s=new Set();
  function addFloorZones(fid){ const f=S[type].floors.find(f=>f.id===fid);if(f)for(const id of f.zoneIds)s.add(id);}
  function addRiserAll(rid){ const r=S[type].risers.find(r=>r.id===rid);if(!r)return;
    for(const id of r.zoneIds)s.add(id); for(const fid of r.floorIds)addFloorZones(fid);}
  for(const f of S[type].floors) for(const id of f.zoneIds) s.add(id);
  for(const r of S[type].risers){for(const id of r.zoneIds)s.add(id);for(const fid of r.floorIds)addFloorZones(fid);}
  for(const id of S[type].main.zoneIds)s.add(id);
  for(const fid of S[type].main.floorIds)addFloorZones(fid);
  for(const rid of S[type].main.riserIds)addRiserAll(rid);
  return s;
}

// Zones not in any floor (for a type) — available for riser direct or main
function zonesNotInFloor(type, exceptFloorId){
  const used=new Set();
  for(const f of S[type].floors){if(f.id===exceptFloorId)continue;for(const id of f.zoneIds)used.add(id);}
  return S.zones.filter(z=>!used.has(z.id));
}

// Floors not in any riser (for a type) — available for riser or main
function floorsNotInRiser(type, exceptRiserId){
  const used=new Set();
  for(const r of S[type].risers){if(r.id===exceptRiserId)continue;for(const fid of r.floorIds)used.add(fid);}
  return S[type].floors.filter(f=>!used.has(f.id));
}

// Main calc: everything assigned to main + anything still unassigned
function calcMainType(type){
  const main=S[type].main;
  let cwQ=0,hwQ=0,sD=0,wD=0;
  for(const rid of main.riserIds){const r=S[type].risers.find(r=>r.id===rid);if(r){const res=calcRiser(r,type);cwQ+=res.cwQ;hwQ+=res.hwQ;sD+=res.sewDFU;wD+=res.wstDFU;}}
  for(const fid of main.floorIds){const f=S[type].floors.find(f=>f.id===fid);if(f){const res=calcFloor(f,type);cwQ+=res.cwQ;hwQ+=res.hwQ;sD+=res.sewDFU;wD+=res.wstDFU;}}
  for(const zid of main.zoneIds){const z=S.zones.find(z=>z.id===zid);if(z){const res=calcZone(z);cwQ+=res.cwQ;hwQ+=res.hwQ;sD+=res.sewDFU;wD+=res.wstDFU;}}
  // include still-unassigned zones
  const aid=allAssignedZoneIds(type);
  for(const z of S.zones){if(!aid.has(z.id)){const r=calcZone(z);cwQ+=r.cwQ;if(!z.elecHW)hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;}}
  // 동시사용률 MAIN관에서만 적용 (급수/급탕 0.85, 오배수는 입상관에서 이미 적용)
  cwQ*=0.85; hwQ*=0.85;
  return {cwQ,hwQ,sewDFU:sD,wstDFU:wD,
    cwPipe:flowPipe(cwQ),hwPipe:flowPipe(hwQ),
    sewPipe:sD>0?Math.max(sewPipe(sD),100):0,
    wstPipe:wD>0?Math.max(wstPipe(wD),50):0};
}

// Returns height (in rows) needed by a horizontal branch chain starting at id
function branchHeight(id, nodes){
  if(!id||!nodes[id]) return 0;
  const n=nodes[id];
  let h=1;
  if(n.branchNext) h=Math.max(h, 1+branchHeight(n.branchNext,nodes));
  if(n.mainNext)   h=Math.max(h, branchHeight(n.mainNext,nodes));
  return h;
}

function layoutPipe(zone){
  const nodes=zone.pipe.nodes;
  const pos={};

  function placeV(id, x, y){
    if(!id||!nodes[id]) return;
    const n=nodes[id];
    pos[id]={x, y, axis:'v'};
    // branch goes horizontal to the RIGHT
    if(n.branchNext) placeH(n.branchNext, x+H_STEP, y);
    // main continues DOWN
    if(n.mainNext){
      const bh=n.branchNext ? branchHeight(n.branchNext,nodes) : 0;
      const dy=Math.max(V_STEP, bh*BR_ROW+20);
      placeV(n.mainNext, x, y+dy);
    }
  }

  function placeH(id, x, y){
    if(!id||!nodes[id]) return;
    const n=nodes[id];
    pos[id]={x, y, axis:'h'};
    // main continues RIGHT
    if(n.mainNext) placeH(n.mainNext, x+H_STEP, y);
    // branch goes DOWN (sub-vertical pipe)
    if(n.branchNext) placeV(n.branchNext, x, y+BR_ROW);
  }

  placeV(zone.pipe.rootId, MX, 30);
  return pos;
}

function renderPipeNode(id, n, p, zoneId, r){
  let cls='', label='', extra='';
  if(n.type==='start'){
    cls='pipe-node-start'; label='메인관 시작';
  } else if(n.type==='junction'){
    cls='pipe-node-junction'; label='T 분기';
  } else if(n.type==='fixture'){
    cls='pipe-node-fixture';
    label=n.fxKey ? FX[n.fxKey].name : '?';
    extra=`<div class="pipe-qty-row">
      <input class="pipe-qty-inp" type="number" min="1" value="${n.qty||1}"
        onchange="setPipeQty('${zoneId}','${id}',+this.value)">
      <span style="font-size:10px;color:var(--text2)">개</span>
    </div>`;
  } else if(n.type==='end'){
    cls='pipe-node-end'; label='종점';
  }

  const del=n.type!=='start'
    ?`<button class="pipe-del" onclick="delPipeNode('${zoneId}','${id}')">✕</button>`:'';

  // Pipe size summary inside node
  function pipeSizeRows(res){
    if(!res) return '';
    let s='';
    if(res.cwPipe)  s+=`<div style="color:#4f8ef7">급수 ${res.cwPipe}A</div>`;
    if(res.hwPipe)  s+=`<div style="color:#e05c8a">급탕 ${res.hwPipe}A</div>`;
    if(res.sewPipe) s+=`<div style="color:#e05c5c">오수 ${res.sewPipe}A</div>`;
    if(res.wstPipe) s+=`<div style="color:#a07cf7">배수 ${res.wstPipe}A</div>`;
    return s;
  }

  let pipeInfo='';
  if(n.type==='fixture' && n.fxKey && r){
    // Individual pipe: calc for just this fixture alone
    // 샤워기는 배수를 FD(배수구)로 처리하므로 개별관에서 drain 제외
    const fxSingle=Object.fromEntries(FX_KEYS.map(k=>[k,0]));
    fxSingle[n.fxKey]=n.qty||1;
    const singleNode={fixtures:fxSingle, children:[]};
    if(n.fxKey==='shw'){
      // 샤워기: 급수/급탕만, 배수(wst) 제외
      const sr0=calcNode(singleNode);
      var sr={...sr0, wstDFU:0, wstPipe:0};
    } else { var sr=calcNode(singleNode); }
    pipeInfo=`<div class="pipe-both-cols">
      <div class="pipe-col">
        <div class="pipe-col-hdr">누적관</div>
        <div class="pipe-node-sizes">${pipeSizeRows(r)}</div>
      </div>
      <div class="pipe-col-div"></div>
      <div class="pipe-col">
        <div class="pipe-col-hdr">개별관</div>
        <div class="pipe-node-sizes">${pipeSizeRows(sr)}</div>
      </div>
    </div>`;
  } else if(r){
    const rows=pipeSizeRows(r);
    if(rows) pipeInfo=`<div class="pipe-node-sizes" style="margin-top:5px;border-top:1px solid var(--border);padding-top:4px">${rows}</div>`;
  }

  return `<div class="pipe-node ${cls}" style="left:${p.x}px;top:${p.y}px" id="pn_${id}">
    ${del}
    <div class="pipe-label">${esc(label)}</div>
    ${extra}
    ${pipeInfo}
  </div>`;
}

// Compute calc result for every node (accumulated downstream)
function calcPipeGraph(zone){
  const nodes=zone.pipe.nodes;
  const cache={};
  function calc(id){
    if(!id||!nodes[id]) return null;
    if(cache[id]) return cache[id];
    cache[id]=calcNode(pipeToCalcNode(id,nodes));
    return cache[id];
  }
  for(const id in nodes) calc(id);
  return cache;
}

// SVG label box for a pipe result, placed at (lx,ly), align = 'right'|'left'|'center'
function svgPipeLabel(r, lx, ly, align){
  const items=[];
  if(r.cwPipe)  items.push({c:'#4f8ef7', t:`급수 ${r.cwPipe}A`});
  if(r.hwPipe)  items.push({c:'#e05c8a', t:`급탕 ${r.hwPipe}A`});
  if(r.sewPipe) items.push({c:'#e05c5c', t:`오수 ${r.sewPipe}A`});
  if(r.wstPipe) items.push({c:'#a07cf7', t:`배수 ${r.wstPipe}A`});
  if(!items.length) return '';
  const LH=12, PAD=3, BW=70;
  const bh=items.length*LH+PAD*2;
  let bx;
  if(align==='right') bx=lx;
  else if(align==='left') bx=lx-BW;
  else bx=lx-BW/2;
  const by=ly-bh/2;
  let s=`<rect x="${bx}" y="${by}" width="${BW}" height="${bh}" rx="3" fill="#11141e" stroke="#2e3350" stroke-width="0.8" opacity="0.92"/>`;
  items.forEach((item,i)=>{
    s+=`<text x="${bx+PAD+2}" y="${by+PAD+LH*(i+0.82)}" fill="${item.c}" font-size="9.5" font-family="Malgun Gothic,sans-serif">${item.t}</text>`;
  });
  return s;
}

function renderPipeCanvas(zone){
  const nodes=zone.pipe.nodes;
  const pos=layoutPipe(zone);
  const gr=calcPipeGraph(zone); // per-node accumulated results

  // Canvas size
  let maxX=0, maxY=0;
  for(const id in pos){
    maxX=Math.max(maxX, pos[id].x+PNW+240);
    maxY=Math.max(maxY, pos[id].y+PNH+200);
  }
  const cW=Math.max(maxX, 800), cH=Math.max(maxY, 600);

  // SVG lines + pipe labels
  let lines='';
  // Draw main pipe backbone (vertical line behind main-pipe nodes)
  const mainIds=[];
  (function walkV(id){ if(!id||!nodes[id]) return; mainIds.push(id); walkV(nodes[id].mainNext); })(zone.pipe.rootId);
  if(mainIds.length>1){
    const first=pos[mainIds[0]], last=pos[mainIds[mainIds.length-1]];
    if(first&&last){
      lines+=`<line x1="${first.x+PNW/2}" y1="${first.y}" x2="${last.x+PNW/2}" y2="${last.y+PNH}" stroke="#2e3350" stroke-width="3"/>`;
    }
  }

  for(const id in pos){
    const n=nodes[id], p=pos[id];
    const cx=p.x+PNW/2, cy=p.y+PNH/2;
    const rx=p.x+PNW,   by=p.y+PNH;

    // Main connection line
    if(n.mainNext&&pos[n.mainNext]){
      const np=pos[n.mainNext];
      if(p.axis==='v'){
        lines+=`<line x1="${cx}" y1="${by}" x2="${np.x+PNW/2}" y2="${np.y}" stroke="#3a4060" stroke-width="2"/>`;
      } else {
        lines+=`<line x1="${rx}" y1="${cy}" x2="${np.x}" y2="${np.y+PNH/2}" stroke="#3a4060" stroke-width="2"/>`;
      }
    }

    // Branch connection line
    if(n.branchNext&&pos[n.branchNext]){
      const bp=pos[n.branchNext];
      if(p.axis==='v'){
        lines+=`<line x1="${rx}" y1="${cy}" x2="${bp.x}" y2="${bp.y+PNH/2}" stroke="#3a4060" stroke-width="2"/>`;
      } else {
        lines+=`<line x1="${cx}" y1="${by}" x2="${bp.x+PNW/2}" y2="${bp.y}" stroke="#3a4060" stroke-width="2"/>`;
      }
    }
  }

  // Add buttons and dashed stub lines
  let addBtns='';
  for(const id in pos){
    const n=nodes[id], p=pos[id];
    if(n.type==='end') continue;
    const cx=p.x+PNW/2, cy=p.y+PNH/2;
    const rx=p.x+PNW,   by=p.y+PNH;

    // Main direction "+" (down for V, right for H)
    if(!n.mainNext){
      if(p.axis==='v'){
        const bx=cx-13, btnY=by+V_STEP/2-13;
        lines+=`<line x1="${cx}" y1="${by}" x2="${cx}" y2="${btnY+13}" stroke="#2e3350" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        addBtns+=`<button class="pipe-add" style="left:${bx}px;top:${btnY}px" title="아래 추가" onclick="openAddPopup('${zone.id}','${id}','main',event)">+</button>`;
      } else {
        const btnX=rx+H_STEP/2-13, bty=cy-13;
        lines+=`<line x1="${rx}" y1="${cy}" x2="${btnX+13}" y2="${cy}" stroke="#2e3350" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        addBtns+=`<button class="pipe-add" style="left:${btnX}px;top:${bty}px" title="우측 추가" onclick="openAddPopup('${zone.id}','${id}','main',event)">+</button>`;
      }
    }

    // Branch direction "+" (right for V junction, down for H junction)
    if(n.type==='junction'&&!n.branchNext){
      if(p.axis==='v'){
        const btnX=rx+H_STEP/2-13, bty=cy-13;
        lines+=`<line x1="${rx}" y1="${cy}" x2="${btnX+13}" y2="${cy}" stroke="#2e3350" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        addBtns+=`<button class="pipe-add" style="left:${btnX}px;top:${bty}px" title="분기 추가" onclick="openAddPopup('${zone.id}','${id}','branch',event)">+</button>`;
      } else {
        const bx=cx-13, btnY=by+BR_ROW/2-13;
        lines+=`<line x1="${cx}" y1="${by}" x2="${cx}" y2="${btnY+13}" stroke="#2e3350" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        addBtns+=`<button class="pipe-add" style="left:${bx}px;top:${btnY}px" title="하위 분기 추가" onclick="openAddPopup('${zone.id}','${id}','branch',event)">+</button>`;
      }
    }
  }

  // Node HTML
  let nodeHTML='';
  for(const id in pos) nodeHTML+=renderPipeNode(id, nodes[id], pos[id], zone.id, gr[id]);

  return `<div class="pipe-canvas" id="pipeCanvas">
    <div class="pipe-inner" style="width:${cW}px;height:${cH}px">
      <svg style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible" width="${cW}" height="${cH}">${lines}</svg>
      ${nodeHTML}
      ${addBtns}
    </div>
  </div>`;
}

// ── Add element popup ──────────────────────────────────────────────────────────
let _addTarget=null;

function openAddPopup(zoneId, fromId, direction, ev){
  ev.stopPropagation();
  closeAddPopup();
  _addTarget={zoneId, fromId, direction};
  const btn=ev.currentTarget;
  const rect=btn.getBoundingClientRect();
  const pop=document.createElement('div');
  pop.className='add-popup';
  pop.id='addPopup';
  pop.style.left=(rect.right+6)+'px';
  pop.style.top=rect.top+'px';
  pop.innerHTML=`
    <button class="add-popup-item" onclick="addPipeEl('junction')">T 분기</button>
    <button class="add-popup-item" onclick="openFxPicker()">기구</button>
    <button class="add-popup-item" onclick="addPipeEl('end')">종점</button>
  `;
  // Keep inside viewport
  document.body.appendChild(pop);
  const pr=pop.getBoundingClientRect();
  if(pr.right>window.innerWidth) pop.style.left=(rect.left-pr.width-6)+'px';
  if(pr.bottom>window.innerHeight) pop.style.top=(rect.bottom-pr.height)+'px';
}

function closeAddPopup(){
  const p=document.getElementById('addPopup');
  if(p) p.remove();
  _addTarget=null;
}

document.addEventListener('click', ()=>closeAddPopup());

function addPipeEl(type, fxKey){
  const t=_addTarget;
  closeAddPopup();
  if(!t) return;
  const {zoneId, fromId, direction}=t;
  const z=findZone(zoneId); if(!z) return;
  const fromNode=z.pipe.nodes[fromId]; if(!fromNode) return;
  const newNode=newPipeNode(type);
  if(fxKey){ newNode.fxKey=fxKey; newNode.qty=1; }
  z.pipe.nodes[newNode.id]=newNode;
  if(direction==='main') fromNode.mainNext=newNode.id;
  else fromNode.branchNext=newNode.id;
  renderAll();
}

function openFxPicker(){
  const t=_addTarget;
  closeAddPopup();
  if(!t) return;
  const ov=document.getElementById('modalOverlay');
  ov.style.display='flex';
  const items=FX_KEYS.map(k=>`<button class="btn btn-ghost fxm-item" onclick="pickFx('${t.zoneId}','${t.fromId}','${t.direction}','${k}')">${FX[k].name}</button>`).join('');
  ov.innerHTML=`<div class="modal" style="width:380px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="modal-title" style="margin:0">기구 선택</div>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="fxm-grid">${items}</div>
  </div>`;
  window._fxTarget=t;
}

function pickFx(zoneId, fromId, direction, fxKey){
  closeModal();
  const z=findZone(zoneId); if(!z) return;
  const fromNode=z.pipe.nodes[fromId]; if(!fromNode) return;
  const n=newPipeNode('fixture');
  n.fxKey=fxKey; n.qty=1;
  z.pipe.nodes[n.id]=n;
  if(direction==='main') fromNode.mainNext=n.id;
  else fromNode.branchNext=n.id;
  renderAll();
}

function setPipeQty(zoneId, nodeId, qty){
  const z=findZone(zoneId); if(!z) return;
  const n=z.pipe.nodes[nodeId]; if(!n) return;
  n.qty=Math.max(1,qty||1);
  const r=calcZone(z);
  const chips=document.getElementById('zone-chips-'+z.id);
  if(chips) chips.innerHTML=chipsHTML(r);
  renderSidebar();
}

function delPipeNode(zoneId, nodeId){
  const z=findZone(zoneId); if(!z) return;
  const nodes=z.pipe.nodes;
  // Detach from parent
  for(const id in nodes){
    if(nodes[id].mainNext===nodeId) nodes[id].mainNext=null;
    if(nodes[id].branchNext===nodeId) nodes[id].branchNext=null;
  }
  // Delete subtree
  (function del(id){ if(!id||!nodes[id]) return; const n=nodes[id]; del(n.mainNext); del(n.branchNext); delete nodes[id]; })(nodeId);
  renderAll();
}

// ── Schematic cumulative helpers ──────────────────────────────────────────────
function sumZonesCum(zoneList){
  let cwQ=0,hwQ=0,sD=0,wD=0;
  for(const z of zoneList){const r=calcZone(z);cwQ+=r.cwQ;if(!z.elecHW)hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;}
  return {cwQ,hwQ,sewDFU:sD,wstDFU:wD,
    cwPipe:flowPipe(cwQ),hwPipe:flowPipe(hwQ),
    sewPipe:sD>0?Math.max(sewPipe(sD),100):0,
    wstPipe:wD>0?Math.max(wstPipe(wD),50):0};
}
function sumFloorsCum(floorList,type){
  let cwQ=0,hwQ=0,sD=0,wD=0;
  for(const fl of floorList){const r=calcFloor(fl,type);cwQ+=r.cwQ;hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;}
  return {cwQ,hwQ,sewDFU:sD,wstDFU:wD,
    cwPipe:flowPipe(cwQ),hwPipe:flowPipe(hwQ),
    sewPipe:sD>0?Math.max(sewPipe(sD),100):0,
    wstPipe:wD>0?Math.max(wstPipe(wD),50):0};
}
function sumRisersCum(riserList,type){
  let cwQ=0,hwQ=0,sD=0,wD=0;
  for(const ri of riserList){const r=calcRiser(ri,type);cwQ+=r.cwQ;hwQ+=r.hwQ;sD+=r.sewDFU;wD+=r.wstDFU;}
  return {cwQ,hwQ,sewDFU:sD,wstDFU:wD,
    cwPipe:flowPipe(cwQ),hwPipe:flowPipe(hwQ),
    sewPipe:sD>0?Math.max(sewPipe(sD),100):0,
    wstPipe:wD>0?Math.max(wstPipe(wD),50):0};
}

// ── Schematic SVG (건물 수직 계통도) ─────────────────────────────────────────
function schematicSVG(type){
  const isCW=type==='cw';
  const risers=S[type].risers, floors=S[type].floors;
  if(!risers.length&&!floors.length) return `<div class="empty">탭 ②③에서 층과 입상관을 설정하세요.</div>`;
  const isTop=S.mainLocation==='top';

  // Layout constants
  const ZW=102, ZH=64;   // zone box = same size as floor box
  const ZG=8;
  const ROW_H=ZH+54;
  const COL_PAD=28;
  const FBW=102, FBH=64;
  const FBG=8;
  const FL_OFFSET=FBW+FBG;
  const RI_SEP=32;
  const MAIN_LW=108;
  const TOP_PAD=20;
  const MAIN_PAD=50;

  // Ordered floor list
  const floorOrder=[];
  const seenFl=new Set();
  for(const ri of risers){for(const fid of ri.floorIds){if(!seenFl.has(fid)){seenFl.add(fid);floorOrder.push(fid);}}}
  for(const fl of floors){if(!seenFl.has(fl.id)){seenFl.add(fl.id);floorOrder.push(fl.id);}}
  const numRows=floorOrder.length||1;

  // Riser column widths & X positions
  const riserData=risers.map(ri=>{
    let maxZ=1;
    for(const fid of ri.floorIds){const fl=floors.find(f=>f.id===fid);if(fl)maxZ=Math.max(maxZ,fl.zoneIds.length);}
    maxZ=Math.max(maxZ,ri.zoneIds.length,1);
    return {ri,maxZ,colW:COL_PAD+maxZ*(ZW+ZG),rr:calcRiser(ri,type)};
  });
  const rX=[];
  let curX=MAIN_LW+FL_OFFSET+16;
  for(const rd of riserData){rX.push(curX);curX+=FL_OFFSET+rd.colW+RI_SEP;}
  const svgW=Math.max(curX+10,500);

  // Y positions
  let rowY,mainLineY;
  if(!isTop){
    rowY=i=>TOP_PAD+i*ROW_H+FBH/2+10;
    mainLineY=TOP_PAD+numRows*ROW_H+10+MAIN_PAD;
  } else {
    mainLineY=TOP_PAD+FBH+24; // riser box extends FBH/2+16=48px above mainLine; leave room
    rowY=i=>mainLineY+MAIN_PAD+20+i*ROW_H+FBH/2;
  }
  const svgH=isTop?mainLineY+MAIN_PAD+20+numRows*ROW_H+30:mainLineY+FBH+30;

  const floorRowIdx={};
  floorOrder.forEach((fid,i)=>{floorRowIdx[fid]=i;});

  const lastRX=rX.length?rX[rX.length-1]:svgW-10;
  let buf='';

  // Floor level guide lines
  for(let i=0;i<floorOrder.length;i++){
    const fy=rowY(i);
    buf+=`<line x1="${MAIN_LW}" y1="${fy}" x2="${lastRX}" y2="${fy}" stroke="#1e2238" stroke-width="0.7" stroke-dasharray="4,6"/>`;
  }

  // MAIN pipe
  const mainR=calcMainType(type);
  buf+=`<line x1="${MAIN_LW}" y1="${mainLineY}" x2="${lastRX}" y2="${mainLineY}" stroke="#f7a64f" stroke-width="3"/>`;
  buf+=`<rect x="4" y="${mainLineY-26}" width="${MAIN_LW-8}" height="52" rx="5" fill="#1a1d27" stroke="#f7a64f" stroke-width="1.5"/>`;
  buf+=`<text x="${MAIN_LW/2}" y="${mainLineY-12}" text-anchor="middle" fill="#e8ecf4" font-size="9.5" font-weight="700" font-family="Malgun Gothic,sans-serif">MAIN관</text>`;
  if(isCW){
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+3}" text-anchor="middle" fill="#4f8ef7" font-size="8.5" font-family="Malgun Gothic,sans-serif">급수 ${ps(mainR.cwPipe)}</text>`;
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+16}" text-anchor="middle" fill="#e05c8a" font-size="8.5" font-family="Malgun Gothic,sans-serif">급탕 ${ps(mainR.hwPipe)}</text>`;
  } else {
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+3}" text-anchor="middle" fill="#e05c5c" font-size="8.5" font-family="Malgun Gothic,sans-serif">오수 ${ps(mainR.sewPipe)}</text>`;
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+16}" text-anchor="middle" fill="#a07cf7" font-size="8.5" font-family="Malgun Gothic,sans-serif">배수 ${ps(mainR.wstPipe)}</text>`;
  }

  // Risers
  const numRisers=risers.length;
  for(let ri_i=0;ri_i<riserData.length;ri_i++){
    const {ri,rr,colW}=riserData[ri_i];
    const rx=rX[ri_i];
    const rColor='#38c9a0';
    const isTermRiser=(ri_i===numRisers-1);
    const rrCum=isTermRiser?null:sumRisersCum(risers.slice(ri_i),type);

    const hasDirect=ri.zoneIds.length>0;
    const hasFloors=ri.floorIds.filter(fid=>floorRowIdx[fid]!==undefined).length>0;
    const pseudoY=isTop?mainLineY+MAIN_PAD+10+FBH/2:mainLineY-MAIN_PAD-FBH/2;

    // Riser vertical extent
    let riserExtY=mainLineY;
    if(hasFloors){
      const ys=ri.floorIds.filter(fid=>floorRowIdx[fid]!==undefined).map(fid=>rowY(floorRowIdx[fid]));
      riserExtY=isTop?Math.max(...ys):Math.min(...ys);
    }
    if(hasDirect) riserExtY=isTop?Math.max(riserExtY,pseudoY):Math.min(riserExtY,pseudoY);

    if(!isTop && riserExtY<mainLineY)
      buf+=`<line x1="${rx}" y1="${riserExtY}" x2="${rx}" y2="${mainLineY}" stroke="${rColor}" stroke-width="2.5"/>`;
    else if(isTop && riserExtY>mainLineY)
      buf+=`<line x1="${rx}" y1="${mainLineY}" x2="${rx}" y2="${riserExtY}" stroke="${rColor}" stroke-width="2.5"/>`;

    // Riser box near main
    const riLY=mainLineY+(isTop?-(FBH/2+16):4);
    buf+=schRiserBox(rx-FBW/2,riLY,FBW,FBH,ri.name,rr,rrCum,isCW,rColor);

    // Floors — sorted nearest-to-main first
    const riFloors=ri.floorIds
      .map(fid=>({fid,fl:floors.find(f=>f.id===fid)}))
      .filter(o=>o.fl&&floorRowIdx[o.fid]!==undefined);
    riFloors.sort((a,b)=>Math.abs(rowY(floorRowIdx[a.fid])-mainLineY)-Math.abs(rowY(floorRowIdx[b.fid])-mainLineY));

    for(let fi=0;fi<riFloors.length;fi++){
      const {fid,fl}=riFloors[fi];
      const fy=rowY(floorRowIdx[fid]);
      const isTermFloor=(fi===riFloors.length-1);
      const flOwn=calcFloor(fl,type);
      const cumFls=riFloors.slice(fi).map(o=>o.fl).filter(Boolean);
      const flCum=isTermFloor?flOwn:sumFloorsCum(cumFls,type);

      buf+=schFloorBox(rx-FBG-FBW,fy-FBH/2,FBW,FBH,fl.name,flOwn,flCum,isCW);
      buf+=`<circle cx="${rx}" cy="${fy}" r="5" fill="${rColor}" stroke="#0f1117" stroke-width="1.2"/>`;

      const numZones=fl.zoneIds.length;
      if(numZones)
        buf+=`<line x1="${rx}" y1="${fy}" x2="${rx+COL_PAD+numZones*(ZW+ZG)}" y2="${fy}" stroke="#3a4060" stroke-width="1.5"/>`;

      let zx=rx+COL_PAD;
      for(let zi=0;zi<numZones;zi++){
        const zid=fl.zoneIds[zi];
        const z=S.zones.find(z=>z.id===zid);
        if(!z){zx+=ZW+ZG;continue;}
        const zrOwn=calcZone(z);
        const isTermZone=(zi===numZones-1);
        const cumZs=fl.zoneIds.slice(zi).map(id=>S.zones.find(z=>z.id===id)).filter(Boolean);
        const zrCum=isTermZone?null:sumZonesCum(cumZs);
        buf+=schZoneBox(zx,fy-ZH/2,ZW,ZH,z.name,zrOwn,zrCum,isCW);
        zx+=ZW+ZG;
      }
    }

    // Direct zones (no floor)
    if(hasDirect){
      const nd=ri.zoneIds.length;
      buf+=`<line x1="${rx}" y1="${pseudoY}" x2="${rx+COL_PAD+nd*(ZW+ZG)}" y2="${pseudoY}" stroke="#3a4060" stroke-width="1.5"/>`;
      buf+=`<circle cx="${rx}" cy="${pseudoY}" r="5" fill="${rColor}" stroke="#0f1117" stroke-width="1.2"/>`;
      let zx2=rx+COL_PAD;
      for(let zi=0;zi<nd;zi++){
        const zid=ri.zoneIds[zi];
        const z=S.zones.find(z=>z.id===zid);
        if(!z){zx2+=ZW+ZG;continue;}
        const zrOwn=calcZone(z);
        const isTermZone=(zi===nd-1);
        const cumZs=ri.zoneIds.slice(zi).map(id=>S.zones.find(z=>z.id===id)).filter(Boolean);
        const zrCum=isTermZone?null:sumZonesCum(cumZs);
        buf+=schZoneBox(zx2,pseudoY-ZH/2,ZW,ZH,z.name,zrOwn,zrCum,isCW);
        zx2+=ZW+ZG;
      }
    }
  }

  return `<div style="overflow:auto;background:var(--bg);padding:12px 16px;border-radius:8px">
    <svg width="${svgW}" height="${svgH}" style="display:block;min-width:${svgW}px">${buf}</svg>
  </div>`;
}

// Zone box: single column if zrCum==null (terminal), else 개별관|누적관
function schZoneBox(x,y,w,h,name,zrOwn,zrCum,isCW){
  const stroke=isCW?'#4f8ef7':'#e05c5c';
  const cx=x+w/2;
  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#1a1d27" stroke="${stroke}" stroke-width="1.5"/>`;
  b+=`<text x="${cx}" y="${y+14}" text-anchor="middle" fill="#e8ecf4" font-size="9.5" font-weight="700" font-family="Malgun Gothic,sans-serif">${esc(name)}</text>`;
  b+=`<line x1="${x+4}" y1="${y+20}" x2="${x+w-4}" y2="${y+20}" stroke="#2e3350" stroke-width="0.8"/>`;
  if(!zrCum){
    b+=`<text x="${cx}" y="${y+31}" text-anchor="middle" fill="#8892aa" font-size="7.5" font-family="Malgun Gothic,sans-serif">개별관</text>`;
    if(isCW){
      if(zrOwn.cwPipe)  b+=`<text x="${cx}" y="${y+45}" text-anchor="middle" fill="#4f8ef7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.cwPipe)}</text>`;
      if(zrOwn.hwPipe)  b+=`<text x="${cx}" y="${y+59}" text-anchor="middle" fill="#e05c8a" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.hwPipe)}</text>`;
    } else {
      if(zrOwn.sewPipe) b+=`<text x="${cx}" y="${y+45}" text-anchor="middle" fill="#e05c5c" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.sewPipe)}</text>`;
      if(zrOwn.wstPipe) b+=`<text x="${cx}" y="${y+59}" text-anchor="middle" fill="#a07cf7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.wstPipe)}</text>`;
    }
  } else {
    b+=`<line x1="${cx}" y1="${y+20}" x2="${cx}" y2="${y+h-4}" stroke="#2e3350" stroke-width="0.8"/>`;
    b+=`<text x="${x+w/4}" y="${y+31}" text-anchor="middle" fill="#8892aa" font-size="7.5" font-family="Malgun Gothic,sans-serif">개별관</text>`;
    b+=`<text x="${x+3*w/4}" y="${y+31}" text-anchor="middle" fill="#8892aa" font-size="7.5" font-family="Malgun Gothic,sans-serif">누적관</text>`;
    if(isCW){
      if(zrOwn.cwPipe)  b+=`<text x="${x+w/4}"   y="${y+45}" text-anchor="middle" fill="#4f8ef7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.cwPipe)}</text>`;
      if(zrOwn.hwPipe)  b+=`<text x="${x+w/4}"   y="${y+59}" text-anchor="middle" fill="#e05c8a" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.hwPipe)}</text>`;
      if(zrCum.cwPipe)  b+=`<text x="${x+3*w/4}" y="${y+45}" text-anchor="middle" fill="#4f8ef7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.cwPipe)}</text>`;
      if(zrCum.hwPipe)  b+=`<text x="${x+3*w/4}" y="${y+59}" text-anchor="middle" fill="#e05c8a" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.hwPipe)}</text>`;
    } else {
      if(zrOwn.sewPipe) b+=`<text x="${x+w/4}"   y="${y+45}" text-anchor="middle" fill="#e05c5c" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.sewPipe)}</text>`;
      if(zrOwn.wstPipe) b+=`<text x="${x+w/4}"   y="${y+59}" text-anchor="middle" fill="#a07cf7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.wstPipe)}</text>`;
      if(zrCum.sewPipe) b+=`<text x="${x+3*w/4}" y="${y+45}" text-anchor="middle" fill="#e05c5c" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.sewPipe)}</text>`;
      if(zrCum.wstPipe) b+=`<text x="${x+3*w/4}" y="${y+59}" text-anchor="middle" fill="#a07cf7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.wstPipe)}</text>`;
    }
  }
  return b;
}

    if(flCum.cwPipe) b+=`<text x="${x+3*w/4}" y="${y+41}" text-anchor="middle" fill="#4f8ef7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.cwPipe)}</text>`;
    if(flCum.hwPipe) b+=`<text x="${x+3*w/4}" y="${y+53}" text-anchor="middle" fill="#e05c8a" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.hwPipe)}</text>`;
  } else {
    if(flOwn.sewPipe) b+=`<text x="${x+w/4}"   y="${y+41}" text-anchor="middle" fill="#e05c5c" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flOwn.sewPipe)}</text>`;
    if(flOwn.wstPipe) b+=`<text x="${x+w/4}"   y="${y+53}" text-anchor="middle" fill="#a07cf7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flOwn.wstPipe)}</text>`;
    if(flCum.sewPipe) b+=`<text x="${x+3*w/4}" y="${y+41}" text-anchor="middle" fill="#e05c5c" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.sewPipe)}</text>`;
    if(flCum.wstPipe) b+=`<text x="${x+3*w/4}" y="${y+53}" text-anchor="middle" fill="#a07cf7" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.wstPipe)}</text>`;
  }
  return b;
}

// Riser box: 자체 | 전체누적 (single col if rrCum==null = terminal riser)
function schRiserBox(x,y,w,h,riName,rrOwn,rrCum,isCW,stroke){
  const cx=x+w/2;
  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#1a1d27" stroke="${stroke}" stroke-width="1.5"/>`;
  b+=`<text x="${cx}" y="${y+13}" text-anchor="middle" fill="#e8ecf4" font-size="9.5" font-weight="700" font-family="Malgun Gothic,sans-serif">${esc(riName)}</text>`;
  b+=`<line x1="${x+4}" y1="${y+18}" x2="${x+w-4}" y2="${y+18}" stroke="#2e3350" stroke-width="0.8"/>`;

    if(isCW){
      if(rrOwn.cwPipe)  b+=`<text x="${cx}" y="${y+31}" text-anchor="middle" fill="#4f8ef7" font-size="8.5" font-family="Malgun Gothic,sans-serif">급수 ${ps(rrOwn.cwPipe)}</text>`;

      if(rrOwn.wstPipe) b+=`<text x="${cx}" y="${y+44}" text-anchor="middle" fill="#a07cf7" font-size="8.5" font-family="Malgun Gothic,sans-serif">배수 ${ps(rrOwn.wstPipe)}</text>`;

  } else {
    b+=`<line x1="${cx}" y1="${y+18}" x2="${cx}" y2="${y+h-4}" stroke="#2e3350" stroke-width="0.8"/>`;
    b+=`<text x="${x+w/4}" y="${y+27}" text-anchor="middle" fill="#8892aa" font-size="7" font-family="Malgun Gothic,sans-serif">자체</text>`;
    b+=`<text x="${x+3*w/4}" y="${y+27}" text-anchor="middle" fill="#8892aa" font-size="7" font-family="Malgun Gothic,sans-serif">전체누적</text>`;
    if(isCW){
      if(rrOwn.cwPipe)  b+=`<text x="${x+w/4}"   y="${y+38}" text-anchor="middle" fill="#4f8ef7" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.cwPipe)}</text>`;
      if(rrOwn.hwPipe)  b+=`<text x="${x+w/4}"   y="${y+51}" text-anchor="middle" fill="#e05c8a" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.hwPipe)}</text>`;
      if(rrCum.cwPipe)  b+=`<text x="${x+3*w/4}" y="${y+38}" text-anchor="middle" fill="#4f8ef7" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.cwPipe)}</text>`;
      if(rrCum.hwPipe)  b+=`<text x="${x+3*w/4}" y="${y+51}" text-anchor="middle" fill="#e05c8a" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.hwPipe)}</text>`;
    } else {
      if(rrOwn.sewPipe) b+=`<text x="${x+w/4}"   y="${y+38}" text-anchor="middle" fill="#e05c5c" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.sewPipe)}</text>`;
      if(rrOwn.wstPipe) b+=`<text x="${x+w/4}"   y="${y+51}" text-anchor="middle" fill="#a07cf7" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.wstPipe)}</text>`;
      if(rrCum.sewPipe) b+=`<text x="${x+3*w/4}" y="${y+38}" text-anchor="middle" fill="#e05c5c" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.sewPipe)}</text>`;
      if(rrCum.wstPipe) b+=`<text x="${x+3*w/4}" y="${y+51}" text-anchor="middle" fill="#a07cf7" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.wstPipe)}</text>`;
    }
  }
  return b;
}

// ── Zone actions ───────────────────────────────────────────────────────────────
function addZone(){
  showModal('화장실 이름','새 화장실 추가',v=>{
    const z=newZone(v||'화장실 '+(S.zones.length+1));
    S.zones.push(z); activeZone=z.id; renderAll();
  });
}
function delZone(id){
  if(!confirm('화장실을 삭제하시겠습니까?')) return;
  S.zones=S.zones.filter(z=>z.id!==id);
  for(const t of['cw','dr']){
    for(const f of S[t].floors) f.zoneIds=f.zoneIds.filter(i=>i!==id);
    for(const r of S[t].risers) r.zoneIds=r.zoneIds.filter(i=>i!==id);
    S[t].main.zoneIds=S[t].main.zoneIds.filter(i=>i!==id);
  }
  if(activeZone===id) activeZone=S.zones[0]?.id||null;
  renderAll();
}
function selZone(id){activeZone=id;renderSidebar();renderEditor();}
function setZoneName(id,v){const z=findZone(id);if(z){z.name=v;renderSidebar();}}
function setZoneFloor(id,v){const z=findZone(id);if(z){z.floor=v;renderSidebar();}}

// ── Floor actions ──────────────────────────────────────────────────────────────
function addFloor(type){
  showModal('층 이름',`새 층 추가 (예: 1층)`,v=>{
    S[type].floors.push({id:uid(),name:v||'층 '+(S[type].floors.length+1),zoneIds:[]});
    renderTab(activeTab);
  });
}
function delFloor(type,id){
  S[type].floors=S[type].floors.filter(f=>f.id!==id);
  for(const r of S[type].risers) r.floorIds=r.floorIds.filter(i=>i!==id);
  S[type].main.floorIds=S[type].main.floorIds.filter(i=>i!==id);
  renderTab(activeTab);

function saveJSON(){
  S.projectName=document.getElementById('projectName').value||S.projectName;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download=(S.projectName||'프로젝트')+'.json'; a.click();
}
function loadJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      Object.assign(S,d);
      // 구 버전(groups/sgs) → 새 버전(floors/risers/main) 마이그레이션
      for(const t of['cw','dr']){
        if(!S[t].floors)  S[t].floors  = S[t].groups || [];
        if(!S[t].risers)  S[t].risers  = [];
        if(!S[t].main)    S[t].main    = {riserIds:[],floorIds:[],zoneIds:[]};
        // 구버전 키 제거
        delete S[t].groups; delete S[t].sgs;
      }
      if(!S.mainLocation) S.mainLocation='bottom';
      let mx=0;
      function scanId(o){
        if(!o) return;
        if(o.id){const n=parseInt(o.id.slice(1));if(!isNaN(n)&&n>mx)mx=n;}
      }
      S.zones.forEach(z=>{
        scanId(z);
        if(z.pipe) Object.values(z.pipe.nodes).forEach(scanId);
      });
      [...S.cw.floors,...S.dr.floors,...S.cw.risers,...S.dr.risers].forEach(scanId);
      _id=mx+1;
      document.getElementById('projectName').value=S.projectName||'';
      activeZone=S.zones[0]?.id||null;
      renderAll();
    }catch(ex){console.error(ex);alert('JSON 파일을 불러오는데 실패했습니다.\n'+ex.message);}
  };
  r.readAsText(f); e.target.value='';
}

// ── Pressure loss (Hazen-Williams) ────────────────────────────────────────────
function hwCoeff(mat){return mat==='copper'?130:mat==='stainless'?140:150;}
function frictionLossKPa(Q_Lmin,D_mm,L_m,mat){
  if(!Q_Lmin||!D_mm||!L_m)return 0;
  const C=hwCoeff(mat),Q=Q_Lmin/60000,D=D_mm/1000;
  const J=10.67*Math.pow(Q,1.852)/(Math.pow(C,1.852)*Math.pow(D,4.87));
  return J*L_m*9.81;
}
function elevLossKPa(h_m){return h_m*9.81;}
const PIPE_SIZES_ALL=[15,20,25,32,40,50,65,80,100,125,150];
function pipeNextSize(d){const i=PIPE_SIZES_ALL.indexOf(d);return(i>=0&&i<PIPE_SIZES_ALL.length-1)?PIPE_SIZES_ALL[i+1]:d;}

function calcAllPressurePaths(type){
  const P=S.pressure,isCW=type==='cw',isTop=S.mainLocation==='top';
  const mat=P.material,floorH=P.floorH,mainLen=P.mainLen,branchLen=P.branchLen;
  const risers=S[type].risers,floors=S[type].floors;
  const mainR=calcMainType(type);
  const mainQ=isCW?mainR.cwQ:mainR.hwQ;
  const mainD=isCW?mainR.cwPipe:mainR.hwPipe;
  const mainFriction=frictionLossKPa(mainQ,mainD,mainLen,mat);
  const paths=[];

  for(const ri of risers){
    const rr=calcRiser(ri,type);
    const riserQ=isCW?rr.cwQ:rr.hwQ;
    const riserD=isCW?rr.cwPipe:rr.hwPipe;
    const riFloors=ri.floorIds.map(fid=>floors.find(f=>f.id===fid)).filter(Boolean);

    for(let fi=0;fi<riFloors.length;fi++){
      const fl=riFloors[fi];
      const flR=calcFloor(fl,type);
      const flQ=isCW?flR.cwQ:flR.hwQ;
      const flD=isCW?flR.cwPipe:flR.hwPipe;
      // Elevation: isTop=true → going down (gain), isTop=false → going up (loss)
      const elevFloors=isTop?(fi+1):(riFloors.length-fi);
      const elevM=elevFloors*floorH;
      const rawElev=elevLossKPa(elevM);
      const elevLoss=isTop?-rawElev:rawElev;
      const riserFriction=frictionLossKPa(riserQ,riserD,elevM,mat);
      const branchFriction=frictionLossKPa(flQ,flD,branchLen,mat);

      const flZones=fl.zoneIds.map(zid=>S.zones.find(z=>z.id===zid)).filter(Boolean);
      for(const z of flZones){
        const zr=calcZone(z);
        const zQ=isCW?zr.cwQ:zr.hwQ;
        const zD=isCW?zr.cwPipe:zr.hwPipe;
        if(!zQ||!zD)continue;
        const zoneFriction=frictionLossKPa(zQ,zD,3,mat);
        const totalLoss=mainFriction+riserFriction+branchFriction+zoneFriction+elevLoss;
        paths.push({
          label:`${ri.name} → ${fl.name} → ${z.name}`,
          segments:[
            {name:'MAIN관',Q:mainQ,D:mainD,L:mainLen,friction:mainFriction,elev:0},
            {name:ri.name+' 수직',Q:riserQ,D:riserD,L:elevM,friction:riserFriction,elev:elevLoss},
            {name:fl.name+' 분기',Q:flQ,D:flD,L:branchLen,friction:branchFriction,elev:0},
            {name:z.name,Q:zQ,D:zD,L:3,friction:zoneFriction,elev:0}
          ],
          totalLoss,residual:P.supplyKPa-totalLoss,ok:(P.supplyKPa-totalLoss)>=P.minResidualKPa
        });
      }
    }

    // Direct zones (no floor)
    for(const zid of ri.zoneIds){
      const z=S.zones.find(z=>z.id===zid);if(!z)continue;
      const zr=calcZone(z);
      const zQ=isCW?zr.cwQ:zr.hwQ;
      const zD=isCW?zr.cwPipe:zr.hwPipe;
      if(!zQ||!zD)continue;
      const elevM=floorH;
      const elevLoss=isTop?-elevLossKPa(elevM):elevLossKPa(elevM);
      const riserFriction=frictionLossKPa(riserQ,riserD,elevM,mat);
      const zoneFriction=frictionLossKPa(zQ,zD,3,mat);
      const totalLoss=mainFriction+riserFriction+zoneFriction+elevLoss;
      paths.push({
        label:`${ri.name} → ${z.name}`,
        segments:[
          {name:'MAIN관',Q:mainQ,D:mainD,L:mainLen,friction:mainFriction,elev:0},
          {name:ri.name+' 수직',Q:riserQ,D:riserD,L:elevM,friction:riserFriction,elev:elevLoss},
          {name:z.name,Q:zQ,D:zD,L:3,friction:zoneFriction,elev:0}
        ],
        totalLoss,residual:P.supplyKPa-totalLoss,ok:(P.supplyKPa-totalLoss)>=P.minResidualKPa
      });
    }
  }
  paths.sort((a,b)=>a.residual-b.residual);
  return paths;
}

function renderPressurePathResult(paths,type,isCW){
  const P=S.pressure;
  if(!paths.length)return`<div class="empty">계산 가능한 경로 없음 (입상관·층·화장실 설정 필요)</div>`;
  const critical=paths[0];
  const critColor=critical.ok?'var(--accent2)':'var(--red)';
  let h=`<div style="background:var(--surface2);border:1.5px solid ${critColor};border-radius:8px;padding:12px;margin-bottom:16px">
    <div style="font-size:10px;color:var(--text2);margin-bottom:4px">임계경로 (최소 잔압)</div>
    <div style="font-size:12px;font-weight:700;color:${critColor};margin-bottom:10px">${critical.ok?'✓':'⚠'} ${critical.label}</div>
    <table style="width:100%;font-size:10.5px;border-collapse:collapse">
      <tr style="color:var(--text3)">
        <td style="padding:2px 5px">구간</td><td style="padding:2px 5px;text-align:center">관경</td>
        <td style="padding:2px 5px;text-align:right">마찰손실</td><td style="padding:2px 5px;text-align:right">위치수두</td><td style="padding:2px 5px;text-align:right">잔압</td>
      </tr>
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:2px 5px;color:var(--accent)">공급압력</td><td></td><td></td><td></td>
        <td style="padding:2px 5px;text-align:right;color:var(--accent);font-weight:700">+${P.supplyKPa.toFixed(0)}</td>
      </tr>`;
  let cum=P.supplyKPa;
  for(const seg of critical.segments){
    cum-=seg.friction; cum-=seg.elev;
    const fCol=seg.friction>25?'var(--warn)':'var(--text)';
    const elvStr=seg.elev===0?'─':(seg.elev>0?`−${seg.elev.toFixed(1)}`:`+${Math.abs(seg.elev).toFixed(1)}`);
    h+=`<tr style="border-top:1px solid var(--border)">
      <td style="padding:2px 5px">${seg.name}</td>
      <td style="padding:2px 5px;text-align:center;color:var(--accent2)">${seg.D?seg.D+'A':'─'}</td>
      <td style="padding:2px 5px;text-align:right;color:${fCol}">−${seg.friction.toFixed(1)}</td>
      <td style="padding:2px 5px;text-align:right">${elvStr}</td>
      <td style="padding:2px 5px;text-align:right">${cum.toFixed(1)}</td>
    </tr>`;
  }
  const resCol=critical.ok?'var(--accent2)':'var(--red)';
  h+=`<tr style="border-top:2px solid var(--border)">
    <td colspan="4" style="padding:3px 5px;font-weight:700;font-size:11px">말단 잔압</td>
    <td style="padding:3px 5px;text-align:right;font-weight:700;font-size:13px;color:${resCol}">${critical.residual.toFixed(1)} kPa</td>
  </tr>
  <tr><td colspan="5" style="padding:1px 5px;font-size:10px;color:${resCol}">${critical.ok?`✓ 기준 ${P.minResidualKPa}kPa 충족`:`⚠ 기준 ${P.minResidualKPa}kPa 미달 — 업사이즈 필요`}</td></tr>
  </table>
  <div style="font-size:10px;color:var(--text3);margin-top:6px;text-align:right">단위: kPa · 이음쇠 상당길이 미포함(실제 ×1.3~1.5 고려)</div>
  </div>`;

  // All paths summary
  h+=`<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px">전체 경로 잔압</div>
  <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">`;
  for(const p of paths){
    const pc=p.ok?'var(--accent2)':'var(--red)';
    const pb=p.ok?'rgba(56,201,160,0.06)':'rgba(224,92,92,0.08)';
    const bar=Math.max(0,Math.min(100,(p.residual/P.supplyKPa)*100));
    const minBar=Math.max(0,Math.min(100,(P.minResidualKPa/P.supplyKPa)*100));
    h+=`<div style="background:${pb};border:1px solid ${pc};border-radius:5px;padding:5px 8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:10.5px">${p.label}</span>
        <span style="font-size:11px;font-weight:700;color:${pc}">${p.residual.toFixed(0)} kPa ${p.ok?'✓':'⚠'}</span>
      </div>
      <div style="position:relative;height:5px;background:var(--surface2);border-radius:3px">
        <div style="height:100%;width:${bar}%;background:${pc};border-radius:3px"></div>
        <div style="position:absolute;top:-1px;left:${minBar}%;width:1.5px;height:7px;background:var(--warn);border-radius:1px" title="최소기준 ${P.minResidualKPa}kPa"></div>
      </div>
    </div>`;
  }
  h+=`</div>`;

  // Upsize suggestions
  const failed=paths.filter(p=>!p.ok);
  if(failed.length){
    h+=`<div class="section" style="border-color:var(--warn);margin-bottom:0">
    <div class="section-title" style="color:var(--warn)">⚠ 업사이즈 권장</div>`;
    const seen=new Set();
    for(const p of failed){
      const worst=p.segments.reduce((a,b)=>a.friction>b.friction?a:b);
      const key=worst.name+'_'+worst.D;
      if(!seen.has(key)){
        seen.add(key);
        h+=`<div style="font-size:11px;padding:5px 0;border-bottom:1px solid var(--border)">
          <b>${worst.name}</b>: <span style="color:var(--red)">${worst.D}A</span> → <span style="color:var(--accent2)">${pipeNextSize(worst.D)}A</span>
          <span style="font-size:10px;color:var(--text3);margin-left:6px">마찰손실 ${worst.friction.toFixed(1)} kPa (최대 구간)</span>
        </div>`;
      }
    }
    h+=`</div>`;
  }
  return h;
}

      ※ 이음쇠 상당길이 미포함 (실제 ×1.3~1.5 적용 권장)<br>
      ※ 급탕은 급수 계산 기준으로 참고
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px">`;

  // CW results
  h+=`<div class="section" style="margin-bottom:20px">
    <div class="section-title">급수 압력검토</div>`;
  if(S.cw.risers.length){
    const cwPaths=calcAllPressurePaths('cw');
    h+=renderPressurePathResult(cwPaths,'cw',true);
  } else {
    h+=`<div class="empty">탭 ②에서 입상관을 설정하세요</div>`;
  }
  h+=`</div>`;

  // HW note (급탕)
  h+=`<div class="section">
    <div class="section-title">급탕 압력검토</div>`;
  const hwPaths=calcAllPressurePaths('cw').filter(p=>p.segments.some(s=>s.Q>0));
  // For HW, recalculate using hwQ/hwPipe
  const hwPathsReal=[];
  if(S.cw.risers.length){
    const P=S.pressure,isTop=S.mainLocation==='top';
    const mat=P.material;
    const mainR=calcMainType('cw');
    const mainQ=mainR.hwQ,mainD=mainR.hwPipe;
    const mainFriction=frictionLossKPa(mainQ,mainD,P.mainLen,mat);
    for(const ri of S.cw.risers){
      const rr=calcRiser(ri,'cw');
      const riserQ=rr.hwQ,riserD=rr.hwPipe;
      const riFloors=ri.floorIds.map(fid=>S.cw.floors.find(f=>f.id===fid)).filter(Boolean);
      for(let fi=0;fi<riFloors.length;fi++){
        const fl=riFloors[fi];
        const flR=calcFloor(fl,'cw');
        const flQ=flR.hwQ,flD=flR.hwPipe;
        if(!flQ)continue;
        const elevFloors=isTop?(fi+1):(riFloors.length-fi);
        const elevM=elevFloors*P.floorH;
        const elevLoss=isTop?-elevLossKPa(elevM):elevLossKPa(elevM);
        const riserFriction=frictionLossKPa(riserQ,riserD,elevM,mat);
        const branchFriction=frictionLossKPa(flQ,flD,P.branchLen,mat);
        const flZones=fl.zoneIds.map(zid=>S.zones.find(z=>z.id===zid)).filter(Boolean).filter(z=>!z.elecHW);
        for(const z of flZones){
          const zr=calcZone(z);
          const zQ=zr.hwQ,zD=zr.hwPipe;
          if(!zQ||!zD)continue;
          const zoneFriction=frictionLossKPa(zQ,zD,3,mat);
          const totalLoss=mainFriction+riserFriction+branchFriction+zoneFriction+elevLoss;
          hwPathsReal.push({
            label:`${ri.name} → ${fl.name} → ${z.name}`,
            segments:[
              {name:'MAIN관(급탕)',Q:mainQ,D:mainD,L:P.mainLen,friction:mainFriction,elev:0},
              {name:ri.name+' 수직',Q:riserQ,D:riserD,L:elevM,friction:riserFriction,elev:elevLoss},
              {name:fl.name+' 분기',Q:flQ,D:flD,L:P.branchLen,friction:branchFriction,elev:0},
              {name:z.name,Q:zQ,D:zD,L:3,friction:zoneFriction,elev:0}
            ],
            totalLoss,residual:P.supplyKPa-totalLoss,ok:(P.supplyKPa-totalLoss)>=P.minResidualKPa
          });
        }
      }
    }
    hwPathsReal.sort((a,b)=>a.residual-b.residual);
  }
  if(hwPathsReal.length){
    h+=renderPressurePathResult(hwPathsReal,'cw',false);
  } else {
    h+=`<div class="empty">급탕 배관이 없거나 (모든 화장실 개별전기온수기) 탭 ②에서 입상관 설정 필요</div>`;
  }
  h+=`</div></div></div>`;
  el.innerHTML=h;
}

// Render zone pipe tree as clean print SVG
function zonePrintSVG(z){
  const nodes=z.pipe.nodes, rootId=z.pipe.rootId;
  if(!rootId||!nodes[rootId])return'';
  const NW=88,NH=38,HGAP=18,VGAP=10;
  const pos={};
  // Calculate subtree width
  function subW(id){
    if(!id||!nodes[id])return 0;
    const n=nodes[id];
    const mw=Math.max(NW,subW(n.mainNext));
    const bw=n.branchNext?(HGAP+subW(n.branchNext)):0;
    return mw+bw;
  }
  // Layout: mainNext goes below, branchNext to the right at same next-row Y
  function layout(id,x,y){
    if(!id||!nodes[id])return;
    const n=nodes[id];
    pos[id]={x,y,n};
    const cy=y+NH+VGAP;
    if(n.mainNext) layout(n.mainNext,x,cy);
    if(n.branchNext) layout(n.branchNext,x+Math.max(NW,subW(n.mainNext))+HGAP,cy);
  }
  layout(rootId,4,4);
  // Bounding box
  let maxX=0,maxY=0;
  for(const id of Object.keys(pos)){maxX=Math.max(maxX,pos[id].x+NW);maxY=Math.max(maxY,pos[id].y+NH);}
  const W=maxX+4,H=maxY+4;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:Malgun Gothic,sans-serif;display:block">`;
  // Draw connections
  for(const id of Object.keys(pos)){
    const {x,y,n}=pos[id];
    if(n.mainNext&&pos[n.mainNext]){
      const cp=pos[n.mainNext];
      s+=`<line x1="${x+NW/2}" y1="${y+NH}" x2="${cp.x+NW/2}" y2="${cp.y}" stroke="#1a2a6c" stroke-width="1.5"/>`;
    }
    if(n.branchNext&&pos[n.branchNext]){
      const bp=pos[n.branchNext];
      const jx=bp.x+NW/2, jy=y+NH+VGAP/2;
      s+=`<polyline points="${x+NW/2},${y+NH} ${x+NW/2},${jy} ${jx},${jy} ${jx},${bp.y}" fill="none" stroke="#1a2a6c" stroke-width="1.2" stroke-dasharray="4,2"/>`;
    }
  }
  // Draw nodes
  for(const id of Object.keys(pos)){
    const {x,y,n}=pos[id];
    const isStart=n.type==='start';
    const fill=isStart?'#e8edf8':'#f4f6fb';
    const stroke=isStart?'#1a2a6c':'#7a90c4';
    const sw=isStart?1.5:1;
    s+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    if(isStart){
      s+=`<text x="${x+NW/2}" y="${y+NH/2+4}" text-anchor="middle" font-size="9" font-weight="700" fill="#1a2a6c">메인관 시작</text>`;
    } else if(n.type==='fixture'&&n.fxKey&&FX[n.fxKey]){
      const fx=FX[n.fxKey];
      // Calc pipe for this single node qty
      const cwPipe=flowPipe(fx.cwQ*(n.qty||1));
      const hwPipe=fx.hot?flowPipe(fx.cwQ*(n.qty||1)):0;
      const sewPipe=fx.drain==='sew'?Math.max(sewPipe(fx.dfu*(n.qty||1)),100):0;
      const wstPipe=fx.drain==='wst'?Math.max(wstPipe(fx.dfu*(n.qty||1)),50):0;
      s+=`<text x="${x+NW/2}" y="${y+11}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1a2a6c">${fx.name}</text>`;
      s+=`<text x="${x+NW/2}" y="${y+21}" text-anchor="middle" font-size="7" fill="#444">${n.qty||1}개</text>`;
      // Pipe tags
      const tags=[];
      if(cwPipe) tags.push({c:'#1a56c4',t:'급수 '+cwPipe+'A'});
      if(hwPipe) tags.push({c:'#c41a1a',t:'급탕 '+hwPipe+'A'});
      if(sewPipe) tags.push({c:'#b52b2b',t:'오수 '+sewPipe+'A'});
      if(wstPipe) tags.push({c:'#6b3ac4',t:'배수 '+wstPipe+'A'});
      const tw=NW/(tags.length||1);
      tags.forEach((tg,i)=>{
        s+=`<text x="${x+tw*i+tw/2}" y="${y+33}" text-anchor="middle" font-size="6.5" font-weight="600" fill="${tg.c}">${tg.t}</text>`;
      });
    }
  }
  s+=`</svg>`;
  return s;
}

            ${row(['<b>합 계</b>','─','─',`<b>${r.cwQ.toFixed(1)} L/min</b>`,'─',

              <div class="val hw-color">${z.elecHW?'개별':'N/A'||(r.hwPipe?r.hwPipe+'A':'N/A')}</div>

    .replace(/<div[^>]*>/g,'').replace(/</div>/g,'')
    .replace(/(<svgs)[^>]*(>)/,(m,a,b)=>{
      const vb=m.match(/viewBox="([^"]+)"/);
      const vbAttr=vb?`viewBox="${vb[1]}"`:(()=>{
        const w=m.match(/width="(d+)"/),h=m.match(/height="(d+)"/);
        return w&&h?`viewBox="0 0 ${w[1]} ${h[1]}"`:'';
      })();
      return `${a}xmlns="http://www.w3.org/2000/svg" ${vbAttr} preserveAspectRatio="xMidYMid meet"${b}`;
    }).trim();

  pages+=`<div class="page">
    ${hdr('급수·급탕 계통도')}
    ${basis()}
    <div class="main-sum">
      <div class="result-card"><div class="lbl">급수 MAIN관</div><div class="val cw-color">${cm.cwPipe?cm.cwPipe+'A':'N/A'}</div><div class="sub">${cm.cwQ.toFixed(1)} L/min × 동시사용률 0.85</div></div>
      <div class="result-card"><div class="lbl">급탕 MAIN관</div><div class="val hw-color">${cm.hwPipe?cm.hwPipe+'A':'N/A'}</div><div class="sub">${cm.hwQ.toFixed(1)} L/min × 동시사용률 0.85</div></div>
    </div>
    <div class="schematic-page">${cwSvgScaled}</div>
    ${footer()}
  </div>`;

  // ── 오배수 계통도 (1페이지) ──
  const dm=calcMainType('dr');
  const drSvgRaw=schematicSVG('dr');
  const drSvgScaled=drSvgRaw
    .replace(/<div[^>]*>/g,'').replace(/</div>/g,'')
    .replace(/(<svgs)[^>]*(>)/,(m,a,b)=>{
      const vb=m.match(/viewBox="([^"]+)"/);
      const vbAttr=vb?`viewBox="${vb[1]}"`:(()=>{
        const w=m.match(/width="(d+)"/),h=m.match(/height="(d+)"/);
        return w&&h?`viewBox="0 0 ${w[1]} ${h[1]}"`:'';
      })();
      return `${a}xmlns="http://www.w3.org/2000/svg" ${vbAttr} preserveAspectRatio="xMidYMid meet"${b}`;
    }).trim();

  pages+=`<div class="page">
    ${hdr('오배수 계통도')}
    ${basis()}
    <div class="main-sum">
      <div class="result-card"><div class="lbl">오수 MAIN관</div><div class="val sew-color">${dm.sewPipe?dm.sewPipe+'A':'N/A'}</div><div class="sub">DFU: ${dm.sewDFU.toFixed(0)}</div></div>
      <div class="result-card"><div class="lbl">배수 MAIN관</div><div class="val wst-color">${dm.wstPipe?dm.wstPipe+'A':'N/A'}</div><div class="sub">DFU: ${dm.wstDFU.toFixed(0)}</div></div>
    </div>
    <div class="schematic-page">${drSvgScaled}</div>
    ${footer()}
  </div>`;

  const win=window.open('','_blank','width=1200,height=900');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>${proj} — 위생배관 관경 계산서</title>
    <style>${css}</style></head>
  <body>${pages}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(),700);
}

  S.projectName='새 프로젝트';

  S.dr={floors:[],risers:[],main:{riserIds:[],floorIds:[],zoneIds:[]}};
  _id=1; activeZone=null;

  renderAll();

function saveJSON(){
  S.projectName=document.getElementById('projectName').value||S.projectName;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));

function loadJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      Object.assign(S,d);
      // 구 버전(groups/sgs) → 새 버전(floors/risers/main) 마이그레이션
      for(const t of['cw','dr']){
        if(!S[t].floors)  S[t].floors  = S[t].groups || [];
        if(!S[t].risers)  S[t].risers  = [];
        if(!S[t].main)    S[t].main    = {riserIds:[],floorIds:[],zoneIds:[]};
        // 구버전 키 제거
        delete S[t].groups; delete S[t].sgs;
      }
      if(!S.mainLocation) S.mainLocation='bottom';
      let mx=0;
      function scanId(o){
        if(!o) return;
        if(o.id){const n=parseInt(o.id.slice(1));if(!isNaN(n)&&n>mx)mx=n;}
      }
      S.zones.forEach(z=>{
        scanId(z);
        if(z.pipe) Object.values(z.pipe.nodes).forEach(scanId);
      });
      [...S.cw.floors,...S.dr.floors,...S.cw.risers,...S.dr.risers].forEach(scanId);
      _id=mx+1;
      document.getElementById('projectName').value=S.projectName||'';
      activeZone=S.zones[0]?.id||null;
      renderAll();
    }catch(ex){console.error(ex);alert('JSON 파일을 불러오는데 실패했습니다.\n'+ex.message);}
  };
  r.readAsText(f); e.target.value='';
}
