    <div style="font-size:11.5px;color:var(--text2);line-height:1.7">${body}</div></div>
  </div>`;
  let h=`<div style="padding:16px;overflow-y:auto;flex:1;max-width:860px">`;
  h+=`<div class="section">
    <div class="section-title">이 앱은</div>
    <div style="font-size:12.5px;line-height:1.8">
      기구수 기반으로 <b style="color:var(--accent)">위생배관 관경(급수·급탕·오수·잡배수·통기)</b>을 화장실 → 층 → 입상관 → 메인까지 자동 계산하고,
      <b style="color:var(--accent)">압력검토</b>와 <b style="color:var(--accent)">화장실 말단 밸브·부속 산출</b>까지 한 번에 만들어 주는 계산서 도구입니다.
      엑셀로 하나하나 계산하던 기구수 관경 계산을 대체합니다.
    </div>
  </div>`;
  h+=`<div class="section"><div class="section-title">작업 순서</div>`;
  h+=step(1,'화장실(존) 만들기','<b>① 개별 화장실</b> 탭에서 Zone을 추가하고, 배관 그림에서 + 버튼으로 기구를 연결합니다. <b>직진</b>은 주관이 계속 가는 것, <b>분기(T)</b>는 가지를 치는 것 — 연결하는 즉시 구간별 관경이 자동 계산됩니다.');
  h+=step(2,'전기온수기 여부','화장실별 전기온수기를 쓰면 체크하세요. 그 존의 온수량이 중앙급탕 관경에서 빠지고, 밸브 산출에 온수기 밸브 세트(차단+체크)가 잡힙니다.');
  h+=step(3,'급수/급탕 연결','<b>② 탭</b>에서 층을 만들어 화장실을 배정하고, 입상관을 만들어 층을 배정합니다. 이 계층이 곧 계통도입니다.');
  h+=step(4,'오배수 연결','<b>③ 탭</b>에서 같은 방식으로 — 급수와 오배수의 계통이 다르면 다르게 구성할 수 있습니다.');
  h+=step(5,'MAIN관 설정','<b>④ 탭</b>에서 메인관에 포함할 항목을 체크하고 <b>급수방식</b>(지하 기계실→상향급수 / 옥상 수조→하향급수)을 선택합니다. 이 선택이 위치수두의 부호를 바꿔 관경에 영향을 줍니다. 급수 동시사용계수·허용유속·배수 MAIN 구배도 여기서 정합니다.');
  h+=step(6,'압력검토 → 자동 상향','<b>⑤ 탭</b>에서 공급압력·층고·배관 길이·이음쇠 등가장 계수를 입력하면 임계경로의 말단 잔압을 검토합니다. 말단 필요압력은 <b>기구별로 자동 적용</b>됩니다(세정밸브 100kPa 등). <b>「잔압 부족 구간 자동 상향」</b> 버튼을 누르면 부족한 구간의 관경을 올리고 다시 계산하기를 반복해 전 경로를 만족시킵니다. <b>입상관에 층을 배정할 때는 위층부터 나열하세요</b> — 순서가 곧 높이입니다.');
  h+=step(7,'결과 확인','<b>⑥ 탭</b>에서 메인관 관경·통기관·건물 계통도를 확인합니다.');
  h+=step(8,'밸브·부속 산출 → 엑셀','<b>⑦ 탭</b>에서 화장실 말단 밸브(볼·앵글·WHA·온수기 세트·진공브레이커)와 부속(티·엘보·레듀서, 개략)이 자동 산출됩니다. <b>📊 엑셀</b> 버튼으로 관경+밸브+부속 전체를 CSV로 내려받습니다.');
  h+=`</div>`;
  h+=`<div class="section"><div class="section-title">버튼 안내</div>
    <table style="width:100%;border-collapse:collapse;font-size:11.5px">
    <tr><td style="padding:4px 6px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600">💾 저장 / 📂 불러오기</td><td style="padding:4px 6px;border-bottom:1px solid var(--border);color:var(--text2)">프로젝트를 JSON 파일로 저장·복원합니다.</td></tr>
    <tr><td style="padding:4px 6px;border-bottom:1px solid var(--border);font-weight:600">📊 엑셀</td><td style="padding:4px 6px;border-bottom:1px solid var(--border);color:var(--text2)">존별/층/입상관/메인 관경 + 통기 + 밸브·부속을 CSV로 내려받습니다.</td></tr>
    <tr><td style="padding:4px 6px;border-bottom:1px solid var(--border);font-weight:600">🖨 PDF 출력</td><td style="padding:4px 6px;border-bottom:1px solid var(--border);color:var(--text2)">화장실별 계산서를 인쇄용으로 출력합니다.</td></tr>
    <tr><td style="padding:4px 6px;border-bottom:1px solid var(--border);font-weight:600">🔄 초기화</td><td style="padding:4px 6px;border-bottom:1px solid var(--border);color:var(--text2)">모든 입력을 기본값으로 되돌립니다.</td></tr>
    <tr><td style="padding:4px 6px;font-weight:600">자동 저장</td><td style="padding:4px 6px;color:var(--text2)">입력 내용은 이 브라우저에 자동 저장됩니다 — 새로고침해도 유지됩니다.</td></tr>
    </table></div>`;
  h+=`<div class="section"><div class="section-title">꼭 알아둘 것</div>
    <div style="font-size:11.5px;color:var(--text2);line-height:1.9">
      ① 부속류(티·엘보·레듀서)는 배관 그림의 연결 구조에서 자동으로 세는 <b>개략치</b>입니다. 배관 <b>길이·보온 물량은 도면(CAD) 실측의 영역</b>이라 이 앱은 다루지 않습니다.<br>
      ② 통기관경은 DFU 개략표 + 담당 배수관경의 1/2 이상, 전개길이 12m 이상 시 한 단계 상향입니다.<br>
      ③ 기계실·입상관 밸브(게이트·PRV·대형 수격방지기 등)는 <b>밸브 계통도 계산서 앱</b>에서 산출하세요 — 두 앱을 합치면 건물 전체 밸브가 됩니다.<br>
      ④ 밸브가 처음이라면 ⑦ 탭 하단의 <b>밸브 설명서</b>를 펼쳐보세요 — 원리를 그림으로 설명합니다.
    </div></div>`;
  h+=basisGuide();
  h+=`</div>`;
  el.innerHTML=h;
}

// ── 기준: HW-001 · 이 화장실이 속한 열원 그룹 카드 (① 개별 화장실 탭) ─────────
//   ④탭까지 가지 않아도 "누구와 묶여 있고 그 결과 관경이 얼마인지"를 그 자리에서 본다.
function hwGroupCard(zone){
  const box=(inner,bd)=>`<div style="margin-top:8px;padding:8px 10px;background:var(--surface2);
    border:1px solid ${bd||'var(--border)'};border-radius:6px;font-size:11.5px;line-height:1.7">${inner}</div>`;
  if(zone.hwSource==='none')
    return box(`<b>급탕 없음</b> <span style="color:var(--text3)">— 이 화장실은 급탕 계산에서 제외됩니다.</span>`);
  if(zone.hwSource==='elec'){
    const r=calcZone(zone);
    return box(`<b>개별 순간온수기</b> <span style="color:var(--text3)">— 중앙급탕 누적에서 빠지고 환탕관이 없습니다.</span>
      ${r.hwQ>0?`<br>이 화장실 급탕 유량 <b>${r.hwQ.toFixed(1)} L/min</b> · 온수기 이후 급탕관 <b>${ps(r.hwPipe)}</b>
      <span style="color:var(--text3)">(온수기 용량은 이 앱의 범위가 아닙니다 — 이 유량으로 선정하세요)</span>`:''}`);
  }
  const b=S.boilers.find(x=>x.id===zone.hwSource);
  if(!b) return '';
  const g=calcBoiler(b.id);
  const names=g.zones.map(z=>z.id===zone.id
    ? `<b style="color:var(--accent)">${esc(z.name)}</b>`
    : `<span style="color:var(--text2)">${esc(z.name)}</span>`).join(' <span style="color:var(--text3)">·</span> ');
  return box(`
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
      <span><b>${esc(b.name)}</b> <span style="color:var(--text3)">중앙급탕 · 화장실 ${g.cnt}개소</span></span>
      <span style="font-size:11px">
        급탕 공급관 <b style="color:var(--warn)">${ps(g.supply)}</b>
        <span style="color:var(--text3)">/</span>
        환탕관 <b style="color:var(--accent2)">${ps(g.ret)}</b></span>
    </div>
    <div style="margin-top:4px">${names}</div>
    <div style="margin-top:3px;color:var(--text3);font-size:10.5px">
      합산 급탕 유량 ${g.hwQ.toFixed(1)} L/min (동시사용 ${((g.hwSimultF||1)*100).toFixed(1)}%) ·
      환탕관은 급탕관 −${S.hwReturnStep??1}단계(관행, 최소 20A)
    </div>`, 'var(--accent)');
}

// ── 기준: HW-001 · 급탕 열원 그룹 패널 (④ MAIN관 탭) ──────────────────────────
function hwSourcePanel(){
  const elecZ=S.zones.filter(z=>z.hwSource==='elec');
  const noneZ=S.zones.filter(z=>z.hwSource==='none');
  let h=`<div class="section"><div class="fr" style="align-items:center;gap:12px;margin-bottom:8px">
    <span class="section-title" style="margin:0">급탕 열원 (중앙급탕 · 환탕)</span>
    <button class="btn btn-sm" onclick="addBoilerUI()">+ 열원 추가</button>
    <label style="font-size:11.5px;color:var(--text2)">환탕관 축소:
      <select style="margin-left:4px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11.5px"
        onchange="S.hwReturnStep=+this.value;renderAll()">
        <option value="1"${(S.hwReturnStep??1)===1?' selected':''}>급탕관 −1단계 (권장)</option>
        <option value="2"${(S.hwReturnStep??1)===2?' selected':''}>급탕관 −2단계</option>
        <option value="0"${(S.hwReturnStep??1)===0?' selected':''}>급탕관과 동일</option>
      </select>
    </label>
  </div>`;
  h+=`<table style="width:100%;border-collapse:collapse;font-size:11.5px">
    <tr style="color:var(--text3)">
      <th style="padding:4px 6px;text-align:left;border-bottom:1.5px solid var(--border)">열원</th>
      <th style="padding:4px 6px;text-align:right;border-bottom:1.5px solid var(--border)">화장실</th>
      <th style="padding:4px 6px;text-align:right;border-bottom:1.5px solid var(--border)">급탕 유량</th>
      <th style="padding:4px 6px;text-align:right;border-bottom:1.5px solid var(--border)">동시사용</th>
      <th style="padding:4px 6px;text-align:right;border-bottom:1.5px solid var(--border)">급탕 공급관</th>
      <th style="padding:4px 6px;text-align:right;border-bottom:1.5px solid var(--border)">환탕관</th>
      <th style="padding:4px 6px;border-bottom:1.5px solid var(--border)"></th>
    </tr>`;
  for(const b of S.boilers){
    const r=calcBoiler(b.id);
    const zoneNames=r.zones.map(z=>z.name).join(', ')||'—';
    h+=`<tr>
      <td style="padding:4px 6px;border-bottom:1px solid var(--border)">
        <input value="${esc(b.name)}" onchange="setBoilerName('${b.id}',this.value)"
          style="width:110px;background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:11.5px;padding:1px 2px">
        <div style="font-size:10px;color:var(--text3);margin-top:2px">${esc(zoneNames)}</div></td>
      <td style="padding:4px 6px;text-align:right;border-bottom:1px solid var(--border)">${r.cnt}개</td>
      <td style="padding:4px 6px;text-align:right;border-bottom:1px solid var(--border)">${r.hwQ.toFixed(1)} L/min</td>
      <td style="padding:4px 6px;text-align:right;border-bottom:1px solid var(--border);color:var(--text2)">${r.hwQ>0?((r.hwSimultF||1)*100).toFixed(1)+'%':'—'}</td>
      <td style="padding:4px 6px;text-align:right;border-bottom:1px solid var(--border);font-weight:700;color:var(--hw,#e0a85c)">${r.supply?r.supply+'A':'—'}</td>
      <td style="padding:4px 6px;text-align:right;border-bottom:1px solid var(--border);font-weight:700;color:var(--accent2)">${r.ret?r.ret+'A':'—'}</td>
      <td style="padding:4px 6px;text-align:right;border-bottom:1px solid var(--border)">
        <button class="btn btn-danger btn-sm" onclick="delBoiler('${b.id}')">삭제</button></td>
    </tr>`;
  }
  h+=`</table>`;
  if(elecZ.length||noneZ.length){
    h+=`<div style="font-size:11px;color:var(--text2);margin-top:8px;line-height:1.7">
      ${elecZ.length?`<b>개별 순간온수기</b> ${elecZ.length}개소 — ${esc(elecZ.map(z=>z.name).join(', '))} <span style="color:var(--text3)">(중앙급탕 누적 제외 · 환탕관 없음)</span><br>`:''}
      ${noneZ.length?`<b>급탕 없음</b> ${noneZ.length}개소 — ${esc(noneZ.map(z=>z.name).join(', '))}`:''}
    </div>`;
  }
  h+=`<div style="font-size:10.5px;color:var(--text3);margin-top:8px;line-height:1.6;padding:8px;background:var(--surface2);border-radius:6px">
    ※ 열원 지정과 <b>새 열원 만들기</b>는 <b>① 개별 화장실</b> 탭에서 바로 할 수 있습니다
       (드롭다운의 「＋ 새 열원 추가…」). 여기는 <b>결과 확인용</b>입니다.<br>
    ※ 환탕관이 급탕관보다 작은 이유 — 환탕관이 나르는 것은 급탕 사용량이 아니라
       <b>배관 열손실을 보충하는 순환수량</b>(통상 온도강하 5℃ 기준)이며, 급탕 설계유량의 1/5~1/10 수준입니다.<br>
    ※ 정식 순환수량 산정에는 <b>배관 실장·보온 두께</b>가 필요합니다. 이 앱은 배관 길이를 다루지 않으므로
       관행식(급탕관 −${S.hwReturnStep??1}단계, 최소 20A)을 적용합니다. 실시설계 시 별도 검토하십시오.
  </div></div>`;
  return h;
}

// ── 산정 근거와 계산 방법 (발주처 검토용 · 학습용) ─────────────────────────────
// 볼트 ~/mep-standards 의 기준 노트(WS-001~003, DR-001~005)와 같은 내용이다.
// 계산 로직을 바꾸면 이 글도 함께 고칠 것.
function basisGuide(){
  const dtl=(t,b)=>`<details style="margin-bottom:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2)">
    <summary style="padding:9px 12px;cursor:pointer;font-size:12.5px;font-weight:600">${t}</summary>
    <div style="padding:4px 14px 14px;font-size:11.8px;color:var(--text2);line-height:1.85">${b}</div></details>`;
  const tbl=rows=>`<table style="width:100%;border-collapse:collapse;font-size:11px;margin:8px 0">${rows}</table>`;
  const th=cells=>`<tr>${cells.map(c=>`<th style="padding:4px 6px;border-bottom:1.5px solid var(--border);text-align:left;color:var(--text)">${c}</th>`).join('')}</tr>`;
  const td=cells=>`<tr>${cells.map(c=>`<td style="padding:4px 6px;border-bottom:1px solid var(--border)">${c}</td>`).join('')}</tr>`;

  let h=`<div class="section"><div class="section-title">산정 근거와 계산 방법</div>
    <div style="font-size:12px;line-height:1.8;margin-bottom:12px">
      이 계산서가 <b>어떤 기준으로, 왜 그렇게</b> 계산하는지 설명합니다.
      발주처 검토 대응에 그대로 쓸 수 있고, 처음 배우는 분은 이 순서대로 읽으면 관경 산정의 흐름이 잡힙니다.
    </div>`;

  h+=dtl('0. 따르는 기준',
    `<b>오수·잡배수·통기 — KDS 31 30 25 : 2021 배수통기설비</b><br>
     · 표 4.1-2 기구배수부하단위(DFU) · 표 4.1-4 건물배수 수평주관(구배별)<br>
     · 표 4.1-5 배수 수평지관과 수직관 · 4.3.4 통기관의 관 지름선정<br><br>
     <b>급수·급탕 — KDS 31 30 15 : 2021 급수설비</b><br>
     · 표 4.3-1 위생기구의 최저 필요 급수압력과 유량 · 표 4.5-1 기구급수관의 최소 관지름<br>
     · <b>단, 관지름 산정법 자체는 KDS 4.1 이 「SAREK 표준 401-2013」으로 위임</b>합니다.
       이 앱의 유량 구간표는 그 계열의 표이며, 결과가 국내 통용 기준
       (마찰손실 50 mmAq/m 이하, 유속 1.5 m/s 이하)을 만족함을 역산으로 확인했습니다.<br><br>
     <b>동시사용계수</b> — 공조위생 기술데이터북(한미)`);

  h+=dtl('1. 가장 중요한 원리 — 급수는 동시사용률을 쓰고, 배수는 쓰지 않습니다',
    `가장 많이 오해하는 지점입니다. <b>"급수는 되고 배수는 안 된다"가 아니라,
     확률을 어디서 한 번 반영하느냐의 차이</b>입니다.<br>
     ${tbl(th(['','넣는 값','동시사용 확률이 반영되는 곳'])+
        td(['<b>급수</b>','기구 순간유량(L/min) 합계','<b>변환 단계</b> — 동시사용계수를 곱해 설계유량을 만든 뒤 관경표로'])+
        td(['<b>배수</b>','기구배수부하단위(DFU) 합계','<b>표 안에 이미</b> — 변환 없이 바로 관경표로']))}
     <b>부하단위(DFU)는 배수량만 환산한 값이 아닙니다.</b> 사용 빈도·지속시간·동시사용 확률까지
     함께 녹여서 만든 상대 단위입니다. 대변기의 실제 순간 배수량은 세면기의 수십 배인데
     DFU 는 4 대 1 인 이유가 그것입니다.<br><br>
     그래서 배수관경표는 <b>애초에 "이 관은 DFU 몇까지"로 보정된 표</b>이고,
     여기에 동시사용률을 또 곱하면 <b>감소가 두 번</b> 적용되어 관경이 과소 산정됩니다.
     어느 쪽이든 <b>두 번 반영하면 틀립니다.</b>`);

  h+=dtl('2. 급수·급탕은 이렇게 계산합니다 (5단계)',
    `<b>① 기구별 순간유량</b> — KDS 표 4.3-1. 예: 대변기(세정밸브) 1.6 L/s = <b>96 L/min</b>,
       세면기 0.1 L/s = 6 L/min. 세정밸브는 순간유량이 매우 큽니다.<br>
     <b>② 구간별 합산</b> — 그 구간이 담당하는 기구의 유량을 더합니다.<br>
     <b>③ 동시사용계수</b> — 기구수에 따라 곱합니다. <b>곡선이 두 개</b>입니다:<br>
     &nbsp;&nbsp;· <b>세정밸브류</b>(대·소변기 플러시밸브): 순간유량이 크고 사용시간이 짧아 계수가 급격히 떨어집니다(기구 100개에 10%).<br>
     &nbsp;&nbsp;· <b>일반기구</b>: 완만합니다(기구 100개에 33%).<br>
     &nbsp;&nbsp;두 그룹에 각자의 계수를 적용한 뒤 <b>합산</b>합니다.<br>
     &nbsp;&nbsp;<b>화장실 → 층 → 입상관 → MAIN 각 단계마다</b> 그 단계가 담당하는 기구수로 적용하며,
       각 단계는 항상 <b>원시 합계</b>를 모아 계산합니다 — 이미 계수가 곱해진 값에 다시 곱하는
       <b>이중 적용을 금지</b>합니다.<br>
     <b>④ 유량 구간표</b> — 설계유량으로 관경을 선정합니다. 이 표는 <b>마찰손실 기준</b>이며
       전 구간 약 19~29 mmAq/m 입니다(기준 50 이하).<br>
     <b>⑤ 유속 검사</b> — 구간표가 마찰손실 기준이라 대구경에서 유속이 올라갑니다.
       선정된 관경의 유속이 <b>${S.cwVmax||1.5} m/s</b>를 넘으면 한 단계 올립니다.<br><br>
     추가로 <b>기구급수관 최소 관지름</b>(KDS 표 4.5-1, 예: 세정밸브 DN25)과
     <b>역전 금지</b>(상류 관경 ≥ 하류 최대 관경)를 항상 만족시킵니다.`);

  h+=dtl('3. 오수·잡배수는 이렇게 계산합니다 (3단계)',
    `<b>① DFU 합산</b> — KDS 표 4.1-2. 대변기 4.0 / 소변기 4.0 / 세면기 1.0 / 욕조 2.0 /
       샤워 2.0 / 주방싱크 2.0 / 청소싱크 3.0 / 세탁기 3.0.
       <b>동시사용률은 곱하지 않습니다</b>(위 1번 참조).<br>
     <b>② 관의 위치에 따라 다른 표</b> — 이게 핵심입니다:<br>
     ${tbl(th(['관의 위치','쓰는 표'])+
        td(['화장실 내부 · 층별 횡주관','표 4.1-5 <b>수평지관</b> 열'])+
        td(['입상관(수직관)','표 4.1-5 <b>수직관</b> 열 — 분기 층수 3 이하 / 3 초과'])+
        td(['건물배수 수평주관(MAIN)','표 4.1-4 — <b>구배별</b>로 값이 다름']))}
     <b>수직관은 분기 층수가 3을 넘으면 두 조건을 동시에</b> 만족해야 합니다 —
       ㉮ 총합 ㉯ 1개 분기층당. 저층부에 화장실이 몰린 건물에서 ㉯가 걸립니다.<br>
     <b>수평주관은 구배를 먼저 정해야</b> 합니다. 구배 1/100 과 1/25 에서 허용 부하가 1.4배 차이나고,
       <b>구배 1/200 에서는 200A 미만을 아예 쓸 수 없습니다</b>(표에 값이 없음).
       완만한 구배에 작은 관을 쓰면 유속이 확보되지 않아 고형물이 퇴적됩니다.<br>
     <b>③ 최소 관경</b> — 오수관 100A, 잡배수관 50A, 그리고 역전 금지.<br><br>
     <b>오수와 잡배수를 분리</b>해 각각 산정합니다(분류식). 대·소변기가 오수,
       나머지가 잡배수입니다.`);

  h+=dtl('4. 압력검토 — 관경과 압력은 순환합니다',
    `관경을 유량으로 정하고 끝내면 안 됩니다. <b>정한 관경으로 잔압을 계산하고, 부족하면 관경을 올리고,
     올린 관경으로 다시 계산</b>해야 합니다. 이 앱은 ⑤ 탭의 「잔압 부족 구간 자동 상향」 버튼이
     그 반복을 대신합니다 — 마찰손실이 가장 큰 구간부터 한 단계씩 올리며 전 경로가 만족할 때까지 돌립니다.<br><br>
     <b>말단에서 확보해야 할 압력</b>은 기구마다 다릅니다(KDS 표 4.3-1):<br>
     ${tbl(th(['기구','필요압력'])+
        td(['대·소변기 <b>세정밸브</b>','<b>100 kPa</b>'])+
        td(['샤워기','70 kPa (압력식·온도감지형 130)'])+
        td(['세면기·욕조·싱크·세정탱크','55 kPa']))}
     그 경로 끝에 있는 기구 중 <b>가장 높은 값</b>이 그 경로의 기준이 됩니다.
     세정밸브가 하나라도 있으면 100 kPa 를 확보해야 합니다.<br><br>
     <b>손실 구성</b> — 마찰손실(Hazen-Williams) + 위치수두. 재질별 유속계수는 PVC 150 / 스테인리스 140 / 동관 130.<br>
     <b>이음쇠 등가장</b> — 엘보·티·밸브의 저항을 직관 길이로 환산해 더합니다.
     실무에서 직관 실장의 <b>1.3~1.5배</b>를 쓰며, 이 앱은 계수로 입력받습니다.<br><br>
     <b>주의 — 층 순서가 곧 높이입니다.</b> 입상관에 층을 배정할 때 <b>위층부터</b> 나열하세요.
     목록의 첫 층을 가장 높은 층으로 보고 위치수두를 계산합니다.`);

  h+=dtl('5. 통기관',
    `KDS 4.3.4 에 따릅니다.<br>
     · <b>담당 배수관 관지름의 1/2 이상</b>, 최소 <b>DN32</b><br>
     · <b>전개길이 12 m 이상이면 전 길이에 대해 한 단계 큰 관지름</b>
       — 입상관은 분기 층수 × 층고로 길이를 추정하므로, 4층 이상이면 대개 걸립니다<br>
     · DFU 규모에 따른 개략표를 함께 적용합니다<br><br>
     <b>한계</b>: KDS 는 신정통기관·통기수직관을 <b>표 4.3-1</b>(배관길이 + 총 DFU)로 결정하도록
       규정합니다. 이 앱은 그 원표 대신 DFU 개략표 + 위 두 규칙으로 대신하고 있습니다.
       실시설계 단계에서는 원표로 대조하십시오.`);

  h+=dtl('6. 발주처가 자주 묻는 것',
    `<b>Q. 배수에 동시사용률을 왜 적용하지 않았습니까?</b><br>
     A. 기구배수부하단위(DFU)가 이미 동시사용 확률을 반영한 단위이고, KDS 표 4.1-4·4.1-5 가
        그 DFU 단위로 작성돼 있기 때문입니다. 별도로 곱하면 이중 감소가 되어 과소 산정됩니다.
        KDS 4.1.5 에도 동시사용률을 곱하라는 규정이 없습니다.<br><br>
     <b>Q. 같은 DFU 인데 층 관경과 입상관 관경이 왜 다릅니까?</b><br>
     A. 표 4.1-5 가 수평지관 열과 수직관 열을 나눠 규정하기 때문입니다. 수직관은 물이 관벽을
        타고 흐르며 중앙에 공기심이 유지되어 허용 부하가 더 큽니다.<br><br>
     <b>Q. 샤워기의 배수는 어디에 반영됐습니까?</b><br>
     A. 샤워는 KDS 표 4.1-2 의 <b>샤워부스 2.0 DFU</b>(트랩 DN50)로 계상합니다.
        다만 <b>샤워가 자체 트랩 없이 욕실 바닥배수구(FD)로 배수되는 구성</b>이라면
        그 부하는 이미 샤워에 계상돼 있으므로 <b>FD 를 중복 입력하지 마십시오</b>.
        (FD 는 KDS 상 「비상용」이 0.0 DFU 이며, 이 앱은 실제 배수를 받는 경우를 고려해 1.0 으로 둡니다.)<br><br>
     <b>Q. 구배를 바꾸면 왜 MAIN 관경이 바뀝니까?</b><br>
     A. 표 4.1-4 가 구배별 표이기 때문입니다. 구배가 완만할수록 유속이 낮아 같은 관경이 받을 수
        있는 부하가 줄어듭니다.<br><br>
     <b>Q. 유량 구간표로 정했는데 유속을 왜 또 봅니까?</b><br>
     A. 구간표가 마찰손실 기준이라 대구경에서 유속이 상한을 넘습니다. 유속이 높으면 유수음·
        워터해머·침식부식이 생기므로 두 조건을 모두 만족시킵니다.`);

  h+=dtl('7. 이 앱이 다루지 않는 것 (한계)',
    `· <b>배관 길이·보온 물량</b> — 도면(CAD) 실측의 영역입니다. 부속류는 연결 구조에서 세는 개략치입니다.<br>
     · <b>통기 표 4.3-1 원표</b> — DFU 개략표 + 1/2 규칙 + 12m 규칙으로 대신합니다.<br>
     · <b>특수 배수</b> — 주방 그리스, 실험실 폐수, 산성 배수 등은 별도 계통이며 다루지 않습니다.<br>
     · <b>우수(빗물)</b> — KDS 31 30 35 우수설비의 영역입니다.<br>
     · <b>150A 초과 급수관</b> — 구간표가 150A 에서 끝납니다. 대형 건물은 별도 검토가 필요합니다.<br>
     · <b>재질별 내경 차이</b> — 유속 검사는 배관용탄소강관(KS D 3507) 내경을 기준으로 합니다.<br><br>
     <b>이 계산서는 계획·기본설계 단계의 관경 산정 도구입니다.</b>
     실시설계에서는 원 기준서로 대조하고, 현장 조건(매설 깊이, 기존 관로 레벨, 통기 방식)을
     반영해 조정하십시오.`);

  h+=`<div style="font-size:11px;color:var(--text3);margin-top:10px;line-height:1.7">
     ※ 표는 <b>하한</b>이지 권장값이 아닙니다. 특히 <b>입상관은 나중에 교체가 불가능</b>하므로,
     유지관리·통기 여건을 고려해 설계자가 상향하는 경우가 많습니다.
     상향한 경우 그 의도를 계산서에 함께 기재하십시오.</div>`;
  h+=`</div>`;
  return h;
}

// ── 엑셀(CSV) 내보내기: 관경 결과 + 밸브 산출 ──────────────────────────────────
function exportCSV(){
  S.projectName=document.getElementById('projectName').value||S.projectName;
  const rows=[];
  rows.push([S.projectName+' — 위생배관 관경 계산서','출력일 '+new Date().toISOString().slice(0,10),
    '동시사용계수: '+(S.cwSimultMode==='legacy'?'고정 0.85(메인만)':'공조위생 기술데이터북 표 — 화장실·층·입상관·메인 각 단계 적용')]);
  rows.push([]);
  rows.push(['[존별 관경]','층','급수 L/min','급수관','급탕 L/min','급탕관','오수 DFU','오수관','잡배수 DFU','잡배수관','기구 구성']);
  for(const z of S.zones){
    const r=calcZone(z);
    rows.push([z.name,z.floor||'',r.cwQ.toFixed(1),ps(r.cwPipe),
      z.elecHW?'—':r.hwQ.toFixed(1),z.elecHW?'전기온수기':ps(r.hwPipe),
      r.sewDFU,ps(r.sewPipe),r.wstDFU,ps(r.wstPipe),zoneFxSummaryCard(z)||'']);
  }
  if(S.cw.floors.length){
    rows.push([]);
    rows.push(['[급수/급탕 층별]','급수 L/min','급수관','급탕 L/min','급탕관']);
    for(const f of S.cw.floors){const r=calcFloor(f,'cw');
      rows.push([f.name,r.cwQ.toFixed(1),ps(r.cwPipe),r.hwQ.toFixed(1),ps(r.hwPipe)]);}
  }
  if(S.cw.risers.length){
    rows.push([]);
    rows.push(['[급수/급탕 입상관]','급수 L/min','급수관','급탕 L/min','급탕관','급수 동시율','급탕 동시율']);
    for(const ri of S.cw.risers){const r=calcRiser(ri,'cw');
      rows.push([ri.name,r.cwQ.toFixed(1),ps(r.cwPipe),r.hwQ.toFixed(1),ps(r.hwPipe),
        ((r.cwSimultF||1)*100).toFixed(0)+'%',((r.hwSimultF||1)*100).toFixed(0)+'%']);}
  }
  if(S.dr.floors.length){
    rows.push([]);
    rows.push(['[오배수 층별]','오수 DFU','오수관','잡배수 DFU','잡배수관']);
    for(const f of S.dr.floors){const r=calcFloor(f,'dr');
      rows.push([f.name,r.sewDFU.toFixed(1),ps(r.sewPipe),r.wstDFU.toFixed(1),ps(r.wstPipe)]);}
  }
  if(S.dr.risers.length){
    rows.push([]);
    rows.push(['[오배수 입상관]','오수 DFU','오수관','오수 통기','잡배수 DFU','잡배수관','잡배수 통기']);
    for(const ri of S.dr.risers){const r=calcRiser(ri,'dr');
      rows.push([ri.name,r.sewDFU.toFixed(1),ps(r.sewPipe),ps(r.sewVent||0),
        r.wstDFU.toFixed(1),ps(r.wstPipe),ps(r.wstVent||0)]);}
  }
  const cm=calcMainType('cw'),dm=calcMainType('dr');
  rows.push([]);
  rows.push(['[MAIN관]','급수','급탕','오수','오수 통기','잡배수','잡배수 통기']);
  rows.push(['관경',ps(cm.cwPipe),ps(cm.hwPipe),ps(dm.sewPipe),ps(dm.sewVent||0),ps(dm.wstPipe),ps(dm.wstVent||0)]);
  rows.push(['유량/부하',cm.cwQ.toFixed(1)+' L/min',cm.hwQ.toFixed(1)+' L/min',
    dm.sewDFU.toFixed(1)+' DFU','',dm.wstDFU.toFixed(1)+' DFU','']);
  // 기구 총계
  const totFx=Object.fromEntries(FX_KEYS.map(k=>[k,0]));
  for(const z of S.zones){const t=zoneFxTotals(z);for(const k of FX_KEYS)totFx[k]+=t[k]||0;}
  rows.push([]);
  rows.push(['[기구 총계]','기구','수량']);
  for(const k of FX_KEYS) if(totFx[k]) rows.push(['',FX[k].name,totFx[k]]);
  rows.push(['','합계',Object.values(totFx).reduce((a,b)=>a+b,0)]);
  rows.push([]);
  rows.push(['[밸브 산출 — 화장실 말단]','품명','용도','구경','수량','비고']);
  for(const z of S.zones) for(const it of zoneValves(z))
    rows.push([z.name,it.name,it.spec,it.pipe,it.qty,it.note]);
  const totals={};
  for(const z of S.zones) for(const it of zoneValves(z)){
    const m=totals[it.name]=totals[it.name]||{}; m[it.pipe]=(m[it.pipe]||0)+it.qty;
  }
  rows.push([]);
  rows.push(['[밸브 집계]','품명','수량 합계','구경×수량']);
  for(const [n,m] of Object.entries(totals)) rows.push(['',n,sumDia(m),fmtDia(m)]);
  // 부속류 (개략 — 길이·보온 미포함: 도면 실측 영역)
  rows.push([]);
  rows.push(['[부속류 산출 — 개략, 구경×수량]','품목','구경×수량','비고']);
  const fTee={},fElb={},fRed={},dTY={},dCO={};
  for(const z of S.zones){
    const f=zoneFittings(z), d=zoneDrainFittings(z);
    mergeDia(fTee,f.tee); mergeDia(fElb,f.elbow); mergeDia(fRed,f.reducer);
    mergeDia(dTY,d.ty); mergeDia(dCO,d.co);
    rows.push([z.name,'티(급수)',fmtDia(f.tee),'분기·기구 접속 자동, 해당 지점 주관 구경']);
    rows.push(['','엘보(급수)',fmtDia(f.elbow),'말단+기구 하강(연결관경)+존 인입 2 개략']);
    if(Object.keys(f.reducer).length) rows.push(['','레듀서(급수)',fmtDia(f.reducer),'관경 축소 지점 자동']);
    rows.push(['','기구접속 TY(배수)',fmtDia(d.ty),'기구 배수관경 기준']);
    rows.push(['','청소구 C.O(배수)',fmtDia(d.co),'수평지관당 오수·잡배수 각 1 (관경 동일, 최대 100A)']);
  }
  for(const f of S.cw.floors){const n=f.zoneIds.length;if(n){const fr=calcFloor(f,'cw');const d=ps(fr.cwPipe);bumpDia(fTee,d,n);rows.push([f.name+' (급수 층 주관)','티(급수)',`${d}×${n}`,'존 분기마다 티 1 자동']);}}
  for(const r of S.cw.risers){const n=r.floorIds.length+r.zoneIds.length;if(n){const rr=calcRiser(r,'cw');const d=ps(rr.cwPipe);bumpDia(fTee,d,n);bumpDia(fElb,d,2);rows.push([r.name+' (급수 입상관)','티+엘보',`티 ${d}×${n} · 엘보 ${d}×2`,'층·직결 분기 티 + 최상·최하부 엘보']);}}
  for(const r of S.dr.risers){
    const rr=calcRiser(r,'dr'); const parts=[];
    if(rr.sewDFU>0){const d=ps(Math.min(rr.sewPipe,100));bumpDia(dCO,d,1);parts.push(`오수 ${d}×1`);}
    if(rr.wstDFU>0){const d=ps(Math.min(rr.wstPipe,100));bumpDia(dCO,d,1);parts.push(`잡배수 ${d}×1`);}
    if(parts.length)rows.push([r.name+' (배수 입상관)','청소구 C.O',parts.join(' · '),'입상관 최하부']);
  }
  rows.push(['[부속 합계]','티(급수)',fmtDia(fTee),'']);
  rows.push(['','엘보(급수)',fmtDia(fElb),'']);
  if(Object.keys(fRed).length) rows.push(['','레듀서(급수)',fmtDia(fRed),'']);
  rows.push(['','기구접속 TY(배수)',fmtDia(dTY),'']);
  rows.push(['','청소구 C.O(배수)',fmtDia(dCO),'']);
  rows.push(['','','','길이·보온 물량은 도면(CAD) 실측 영역 — 본 산출 미포함']);
  const csv=String.fromCharCode(0xFEFF)+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url; a.download=(S.projectName||'프로젝트')+'_관경밸브.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ── Schematic cumulative helpers ──────────────────────────────────────────────
// 계통도 누적 — 원시 합계를 모아 누적 구간의 기구수로 계수 적용 (이중 적용 방지)
function sumZonesCum(zoneList){
  const a=newAcc();
  for(const z of zoneList) accAdd(a,calcZone(z),z.elecHW);
  return accResult(a);
}
function sumFloorsCum(floorList,type){
  const a=newAcc();
  for(const fl of floorList) accAdd(a,calcFloor(fl,type),false);
  return accResult(a);
}
function sumRisersCum(riserList,type){
  const a=newAcc();
  for(const ri of riserList) accAdd(a,calcRiser(ri,type),false);
  return accResult(a);
}

// ── Schematic SVG (건물 수직 계통도) ─────────────────────────────────────────
function schematicSVG(type){
  const isCW=type==='cw';
  const risers=S[type].risers, floors=S[type].floors;
  if(!risers.length&&!floors.length) return '<div class="empty">탭 ②③에서 층과 입상관을 설정하세요.</div>';
  const isTop=S.mainLocation==='top';

  const FBW=102,FBH=64,FBG=8;
  const ZW=102,ZH=64,ZG=8;
  const FLOOR_H=FBH+44;
  const ZONE_GAP=14;
  const RISER_COL_GAP=20;
  const MAIN_LW=88;
  const TOP_PAD=20;
  const MAIN_PAD=48;

  const _nfl=n=>(n||'').trim().replace(/[층F]$/i,'').trim();
  const _flNum=n=>{const v=parseFloat(_nfl(n));return isNaN(v)?999:v;};

  const floorKeyToName={};
  for(const ri of risers){
    for(const fid of ri.floorIds){
      const fl=floors.find(f=>f.id===fid);
      if(fl){const k=_nfl(fl.name);if(!(k in floorKeyToName))floorKeyToName[k]=fl.name;}
    }
    for(const zid of ri.zoneIds){
      const z=S.zones.find(z=>z.id===zid);
      if(z&&z.floor){const k=_nfl(z.floor);if(!(k in floorKeyToName))floorKeyToName[k]=z.floor;}
    }
  }
  const sortedKeys=Object.keys(floorKeyToName).sort((a,b)=>_flNum(a)-_flNum(b));
  if(!sortedKeys.length) return '<div class="empty">층 또는 화장실 정보를 입력하세요.</div>';
  const numRows=sortedKeys.length;

  const floorToRow={};
  sortedKeys.forEach((k,i)=>{ floorToRow[k]=isTop?i:(numRows-1-i); });
  const rowY=row=>TOP_PAD+row*FLOOR_H+FBH/2+10;

  let mainLineY;
  if(!isTop) mainLineY=TOP_PAD+numRows*FLOOR_H+10+MAIN_PAD;
  else        mainLineY=TOP_PAD+FBH+24;

  const riserData=risers.map((ri,ri_i)=>{
    const rr=calcRiser(ri,type);
    const rrCum=(ri_i===risers.length-1)?null:sumRisersCum(risers.slice(ri_i),type);
    const floorZones={};
    for(const fid of ri.floorIds){
      const fl=floors.find(f=>f.id===fid);
      if(!fl) continue;
      const k=_nfl(fl.name);
      if(!floorZones[k]) floorZones[k]={groupFloor:null,directZids:[]};
      floorZones[k].groupFloor=fl;
    }
    for(const zid of ri.zoneIds){
      const z=S.zones.find(z=>z.id===zid);
      if(!z) continue;
      const k=_nfl(z.floor||'');
      if(!floorZones[k]) floorZones[k]={groupFloor:null,directZids:[]};
      floorZones[k].directZids.push(zid);
    }
    const maxZ=Math.max(1,...Object.values(floorZones).map(fz=>
      fz.groupFloor?fz.groupFloor.zoneIds.length:fz.directZids.length));
    const colW=FBW+FBG+ZONE_GAP+maxZ*(ZW+ZG);
    return {ri,rr,rrCum,floorZones,colW};
  });

  let curColX=MAIN_LW+20;
  const riserLineX=[];
  for(const rd of riserData){
    riserLineX.push(curColX+FBW+FBG);
    curColX+=rd.colW+RISER_COL_GAP;
  }
  const svgW=Math.max(curColX+10,500);
  const svgH=isTop?mainLineY+MAIN_PAD+numRows*FLOOR_H+30:mainLineY+FBH+30;

  let buf='';

  const mainR=calcMainType(type);
  const lastRLX=riserLineX.length?riserLineX[riserLineX.length-1]:svgW-10;
  buf+=`<line x1="${MAIN_LW}" y1="${mainLineY}" x2="${lastRLX}" y2="${mainLineY}" stroke="#f7a64f" stroke-width="3"/>`;
  buf+=`<rect x="4" y="${mainLineY-22}" width="${MAIN_LW-8}" height="44" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>`;
  buf+=`<text x="${MAIN_LW/2}" y="${mainLineY-9}" text-anchor="middle" fill="#1a2a4a" font-size="9.5" font-weight="700" font-family="Malgun Gothic,sans-serif">MAIN관</text>`;
  if(isCW){
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+3}" text-anchor="middle" fill="#2563eb" font-size="8.5" font-family="Malgun Gothic,sans-serif">급수 ${ps(mainR.cwPipe)}</text>`;
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+13}" text-anchor="middle" fill="#db2777" font-size="8.5" font-family="Malgun Gothic,sans-serif">급탕 ${ps(mainR.hwPipe)}</text>`;
  } else {
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+3}" text-anchor="middle" fill="#dc2626" font-size="8.5" font-family="Malgun Gothic,sans-serif">오수 ${ps(mainR.sewPipe)}</text>`;
    buf+=`<text x="${MAIN_LW/2}" y="${mainLineY+13}" text-anchor="middle" fill="#7c3aed" font-size="8.5" font-family="Malgun Gothic,sans-serif">배수 ${ps(mainR.wstPipe)}</text>`;
  }

  for(let ri_i=0;ri_i<riserData.length;ri_i++){
    const {ri,rr,rrCum,floorZones}=riserData[ri_i];
    const rlx=riserLineX[ri_i];
    const rColor='#059669';

    const riKeys=Object.keys(floorZones).filter(k=>k in floorToRow);
    if(!riKeys.length) continue;
    const riRows=riKeys.map(k=>floorToRow[k]);
    const minRow=Math.min(...riRows);
    const maxRow=Math.max(...riRows);

    const farY=isTop?rowY(maxRow):rowY(minRow);
    if(!isTop) buf+=`<line x1="${rlx}" y1="${farY}" x2="${rlx}" y2="${mainLineY}" stroke="${rColor}" stroke-width="2.5"/>`;
    else        buf+=`<line x1="${rlx}" y1="${mainLineY}" x2="${rlx}" y2="${farY}" stroke="${rColor}" stroke-width="2.5"/>`;

    const rbY=isTop?mainLineY-(FBH+4):mainLineY+4;
    buf+=schRiserBox(rlx-FBW/2,rbY,FBW,FBH,ri.name,rr,rrCum,isCW,rColor);

    const sortedRiKeys=riKeys.sort((a,b)=>isTop?(floorToRow[a]-floorToRow[b]):(floorToRow[b]-floorToRow[a]));

    for(let fi=0;fi<sortedRiKeys.length;fi++){
      const fk=sortedRiKeys[fi];
      const {groupFloor,directZids}=floorZones[fk];
      const fy=rowY(floorToRow[fk]);
      const isTermFloor=(fi===sortedRiKeys.length-1);
      const zids=groupFloor?groupFloor.zoneIds:directZids;

      let flOwn,flCum;
      if(groupFloor){
        flOwn=calcFloor(groupFloor,type);
        const cumFls=sortedRiKeys.slice(fi).map(k=>floorZones[k].groupFloor).filter(Boolean);
        flCum=isTermFloor?flOwn:sumFloorsCum(cumFls,type);
      } else {
        const ownZs=directZids.map(id=>S.zones.find(z=>z.id===id)).filter(Boolean);
        flOwn=sumZonesCum(ownZs);
        if(isTermFloor){
          flCum=flOwn;
        } else {
          const cumZs=sortedRiKeys.slice(fi).flatMap(k=>
            floorZones[k].directZids.map(id=>S.zones.find(z=>z.id===id)).filter(Boolean));
          flCum=sumZonesCum(cumZs);
        }
      }

      const dispName=floorKeyToName[fk]||fk;
      buf+=schFloorBox(rlx-FBG-FBW,fy-FBH/2,FBW,FBH,dispName,flOwn,flCum,isCW);
      buf+=`<circle cx="${rlx}" cy="${fy}" r="5" fill="${rColor}" stroke="#ffffff" stroke-width="1.5"/>`;
      if(zids.length)
        buf+=`<line x1="${rlx}" y1="${fy}" x2="${rlx+ZONE_GAP+zids.length*(ZW+ZG)}" y2="${fy}" stroke="#9bacc8" stroke-width="1.5"/>`;
      let zx=rlx+ZONE_GAP;
      for(let zi=0;zi<zids.length;zi++){
        const zid=zids[zi];
        const z=S.zones.find(z=>z.id===zid);
        if(!z){zx+=ZW+ZG;continue;}
        const zrOwn=calcZone(z);
        const isTermZone=(zi===zids.length-1);
        const cumZs=zids.slice(zi).map(id=>S.zones.find(z=>z.id===id)).filter(Boolean);
        const zrCum=isTermZone?null:sumZonesCum(cumZs);
        buf+=schZoneBox(zx,fy-ZH/2,ZW,ZH,z.name,zrOwn,zrCum,isCW);
        zx+=ZW+ZG;
      }
    }
  }

  return `<div style="overflow:auto;background:var(--bg);padding:12px 16px;border-radius:8px">
    <svg width="${svgW}" height="${svgH}" style="display:block;min-width:${svgW}px">${buf}</svg>
  </div>`;
}

function schZoneBox(x,y,w,h,name,zrOwn,zrCum,isCW){
  const stroke=isCW?'#4f8ef7':'#e05c5c';
  const cx=x+w/2;
  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#ffffff" stroke="${stroke}" stroke-width="1.5"/>`;
  b+=`<text x="${cx}" y="${y+14}" text-anchor="middle" fill="#1a2a4a" font-size="9.5" font-weight="700" font-family="Malgun Gothic,sans-serif">${esc(name)}</text>`;
  b+=`<line x1="${x+4}" y1="${y+20}" x2="${x+w-4}" y2="${y+20}" stroke="#d0d8ee" stroke-width="0.8"/>`;
  if(!zrCum){
    b+=`<text x="${cx}" y="${y+31}" text-anchor="middle" fill="#5a6b85" font-size="7.5" font-family="Malgun Gothic,sans-serif">개별관</text>`;
    if(isCW){
      if(zrOwn.cwPipe)  b+=`<text x="${cx}" y="${y+45}" text-anchor="middle" fill="#2563eb" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.cwPipe)}</text>`;
      if(zrOwn.hwPipe)  b+=`<text x="${cx}" y="${y+59}" text-anchor="middle" fill="#db2777" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.hwPipe)}</text>`;
    } else {
      if(zrOwn.sewPipe) b+=`<text x="${cx}" y="${y+45}" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.sewPipe)}</text>`;
      if(zrOwn.wstPipe) b+=`<text x="${cx}" y="${y+59}" text-anchor="middle" fill="#7c3aed" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.wstPipe)}</text>`;
    }
  } else {
    b+=`<line x1="${cx}" y1="${y+20}" x2="${cx}" y2="${y+h-4}" stroke="#d0d8ee" stroke-width="0.8"/>`;
    b+=`<text x="${x+w/4}" y="${y+31}" text-anchor="middle" fill="#5a6b85" font-size="7.5" font-family="Malgun Gothic,sans-serif">개별관</text>`;
    b+=`<text x="${x+3*w/4}" y="${y+31}" text-anchor="middle" fill="#5a6b85" font-size="7.5" font-family="Malgun Gothic,sans-serif">누적관</text>`;
    if(isCW){
      if(zrOwn.cwPipe)  b+=`<text x="${x+w/4}"   y="${y+45}" text-anchor="middle" fill="#2563eb" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.cwPipe)}</text>`;
      if(zrOwn.hwPipe)  b+=`<text x="${x+w/4}"   y="${y+59}" text-anchor="middle" fill="#db2777" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.hwPipe)}</text>`;
      if(zrCum.cwPipe)  b+=`<text x="${x+3*w/4}" y="${y+45}" text-anchor="middle" fill="#2563eb" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.cwPipe)}</text>`;
      if(zrCum.hwPipe)  b+=`<text x="${x+3*w/4}" y="${y+59}" text-anchor="middle" fill="#db2777" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.hwPipe)}</text>`;
    } else {
      if(zrOwn.sewPipe) b+=`<text x="${x+w/4}"   y="${y+45}" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.sewPipe)}</text>`;
      if(zrOwn.wstPipe) b+=`<text x="${x+w/4}"   y="${y+59}" text-anchor="middle" fill="#7c3aed" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrOwn.wstPipe)}</text>`;
      if(zrCum.sewPipe) b+=`<text x="${x+3*w/4}" y="${y+45}" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.sewPipe)}</text>`;
      if(zrCum.wstPipe) b+=`<text x="${x+3*w/4}" y="${y+59}" text-anchor="middle" fill="#7c3aed" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(zrCum.wstPipe)}</text>`;
    }
  }
  return b;
}

// Floor box: 층자체 | 전체누적 (always 2 columns)
function schFloorBox(x,y,w,h,flName,flOwn,flCum,isCW){
  const stroke=isCW?'#4f8ef7':'#e05c5c';
  const cx=x+w/2;
  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#ffffff" stroke="${stroke}" stroke-width="1.2"/>`;
  b+=`<text x="${cx}" y="${y+13}" text-anchor="middle" fill="#1a2a4a" font-size="9" font-weight="700" font-family="Malgun Gothic,sans-serif">${esc(flName)}</text>`;
  b+=`<line x1="${x+4}" y1="${y+18}" x2="${x+w-4}" y2="${y+18}" stroke="#d0d8ee" stroke-width="0.8"/>`;
  b+=`<line x1="${cx}" y1="${y+18}" x2="${cx}" y2="${y+h-4}" stroke="#d0d8ee" stroke-width="0.8"/>`;
  b+=`<text x="${x+w/4}" y="${y+28}" text-anchor="middle" fill="#5a6b85" font-size="7" font-family="Malgun Gothic,sans-serif">층자체</text>`;
  b+=`<text x="${x+3*w/4}" y="${y+28}" text-anchor="middle" fill="#5a6b85" font-size="7" font-family="Malgun Gothic,sans-serif">전체누적</text>`;
  if(isCW){
    if(flOwn.cwPipe) b+=`<text x="${x+w/4}"   y="${y+41}" text-anchor="middle" fill="#2563eb" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flOwn.cwPipe)}</text>`;
    if(flOwn.hwPipe) b+=`<text x="${x+w/4}"   y="${y+53}" text-anchor="middle" fill="#db2777" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flOwn.hwPipe)}</text>`;
    if(flCum.cwPipe) b+=`<text x="${x+3*w/4}" y="${y+41}" text-anchor="middle" fill="#2563eb" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.cwPipe)}</text>`;
    if(flCum.hwPipe) b+=`<text x="${x+3*w/4}" y="${y+53}" text-anchor="middle" fill="#db2777" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.hwPipe)}</text>`;
  } else {
    if(flOwn.sewPipe) b+=`<text x="${x+w/4}"   y="${y+41}" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flOwn.sewPipe)}</text>`;
    if(flOwn.wstPipe) b+=`<text x="${x+w/4}"   y="${y+53}" text-anchor="middle" fill="#7c3aed" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flOwn.wstPipe)}</text>`;
    if(flCum.sewPipe) b+=`<text x="${x+3*w/4}" y="${y+41}" text-anchor="middle" fill="#dc2626" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.sewPipe)}</text>`;
    if(flCum.wstPipe) b+=`<text x="${x+3*w/4}" y="${y+53}" text-anchor="middle" fill="#7c3aed" font-size="9" font-family="Malgun Gothic,sans-serif">${ps(flCum.wstPipe)}</text>`;
  }
  return b;
}

// Riser box: 자체 | 전체누적 (single col if rrCum==null = terminal riser)
function schRiserBox(x,y,w,h,riName,rrOwn,rrCum,isCW,stroke){
  const cx=x+w/2;
  let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#ffffff" stroke="${stroke}" stroke-width="1.5"/>`;
  b+=`<text x="${cx}" y="${y+13}" text-anchor="middle" fill="#1a2a4a" font-size="9.5" font-weight="700" font-family="Malgun Gothic,sans-serif">${esc(riName)}</text>`;
  b+=`<line x1="${x+4}" y1="${y+18}" x2="${x+w-4}" y2="${y+18}" stroke="#d0d8ee" stroke-width="0.8"/>`;
  if(!rrCum){
    if(isCW){
      if(rrOwn.cwPipe)  b+=`<text x="${cx}" y="${y+31}" text-anchor="middle" fill="#2563eb" font-size="8.5" font-family="Malgun Gothic,sans-serif">급수 ${ps(rrOwn.cwPipe)}</text>`;

    } else {
      if(rrOwn.sewPipe) b+=`<text x="${cx}" y="${y+31}" text-anchor="middle" fill="#dc2626" font-size="8.5" font-family="Malgun Gothic,sans-serif">오수 ${ps(rrOwn.sewPipe)}</text>`;
      if(rrOwn.wstPipe) b+=`<text x="${cx}" y="${y+44}" text-anchor="middle" fill="#7c3aed" font-size="8.5" font-family="Malgun Gothic,sans-serif">배수 ${ps(rrOwn.wstPipe)}</text>`;
    }
  } else {
    b+=`<line x1="${cx}" y1="${y+18}" x2="${cx}" y2="${y+h-4}" stroke="#d0d8ee" stroke-width="0.8"/>`;
    b+=`<text x="${x+w/4}" y="${y+27}" text-anchor="middle" fill="#5a6b85" font-size="7" font-family="Malgun Gothic,sans-serif">자체</text>`;
    b+=`<text x="${x+3*w/4}" y="${y+27}" text-anchor="middle" fill="#5a6b85" font-size="7" font-family="Malgun Gothic,sans-serif">전체누적</text>`;
    if(isCW){
      if(rrOwn.cwPipe)  b+=`<text x="${x+w/4}"   y="${y+38}" text-anchor="middle" fill="#2563eb" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.cwPipe)}</text>`;
      if(rrOwn.hwPipe)  b+=`<text x="${x+w/4}"   y="${y+51}" text-anchor="middle" fill="#db2777" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.hwPipe)}</text>`;
      if(rrCum.cwPipe)  b+=`<text x="${x+3*w/4}" y="${y+38}" text-anchor="middle" fill="#2563eb" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.cwPipe)}</text>`;
      if(rrCum.hwPipe)  b+=`<text x="${x+3*w/4}" y="${y+51}" text-anchor="middle" fill="#db2777" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.hwPipe)}</text>`;
    } else {
      if(rrOwn.sewPipe) b+=`<text x="${x+w/4}"   y="${y+38}" text-anchor="middle" fill="#dc2626" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.sewPipe)}</text>`;
      if(rrOwn.wstPipe) b+=`<text x="${x+w/4}"   y="${y+51}" text-anchor="middle" fill="#7c3aed" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrOwn.wstPipe)}</text>`;
      if(rrCum.sewPipe) b+=`<text x="${x+3*w/4}" y="${y+38}" text-anchor="middle" fill="#dc2626" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.sewPipe)}</text>`;
      if(rrCum.wstPipe) b+=`<text x="${x+3*w/4}" y="${y+51}" text-anchor="middle" fill="#7c3aed" font-size="8.5" font-family="Malgun Gothic,sans-serif">${ps(rrCum.wstPipe)}</text>`;
    }
  }

// ── Pressure loss (Hazen-Williams) ────────────────────────────────────────────
function hwCoeff(mat){return mat==='copper'?130:mat==='stainless'?140:150;}
function frictionLossKPa(Q_Lmin,D_mm,L_m,mat){
  if(!Q_Lmin||!D_mm||!L_m)return 0;
  const C=hwCoeff(mat),Q=Q_Lmin/60000,D=D_mm/1000;
  const J=10.67*Math.pow(Q,1.852)/(Math.pow(C,1.852)*Math.pow(D,4.87));
  return J*L_m*9.81;
}
function elevLossKPa(h_m){return h_m*9.81;}

// ── 기준: WS-005 · 관경↔압력 순환 해석 ────────────────────────────────────────
//   관경과 압력은 순환 관계다. 유량표로 정한 관경으로 잔압을 계산하고, 기구가 요구하는
//   최저 압력(KDS 표 4.3-1)에 못 미치면 관경을 올리고, 올린 관경으로 다시 계산한다.
//   상향 대상은 그 경로에서 마찰손실이 가장 큰 구간부터 고른다(효과가 가장 큰 곳).
//   결과는 각 객체의 upsize(단계수)에 남고 applyUpsize() 가 관경에 반영한다.
function pathEntity(type,ids,idx,n){
  if(!ids) return null;
  if(idx===0) return S[type].main;                         // 첫 구간은 항상 MAIN
  if(idx===n-1) return S.zones.find(z=>z.id===ids.z);      // 마지막은 항상 존
  const mids=[];
  if(ids.r) mids.push(S[type].risers.find(r=>r.id===ids.r));
  if(ids.f) mids.push(S[type].floors.find(f=>f.id===ids.f));
  return mids[idx-1]||null;
}
function solvePressureUpsize(type){
  const MAXIT=40, MAXSTEP=4;
  let changed=0;
  for(let it=0;it<MAXIT;it++){
    const bad=calcAllPressurePaths(type).filter(p=>!p.ok);
    if(!bad.length) break;
    bad.sort((a,b)=>(a.residual-a.reqKPa)-(b.residual-b.reqKPa));  // 가장 부족한 경로부터
    const p=bad[0], n=p.segments.length;
    const order=p.segments.map((s,i)=>({i,f:s.friction})).sort((x,y)=>y.f-x.f);
    let bumped=false;
    for(const seg of order){
      const t=pathEntity(type,p.ids,seg.i,n);
      if(!t) continue;
      const cur=+(t.upsize||0);
      if(cur>=MAXSTEP) continue;
      t.upsize=cur+1; bumped=true; changed++;
      break;
    }
    if(!bumped) break;    // 더 올릴 곳이 없다 — 공급압력 자체가 부족한 경우
  }
  if(changed) persist();
  return changed;
}
function clearPressureUpsize(type){
  let n=0;
  const wipe=o=>{ if(o&&o.upsize){o.upsize=0;n++;} };
  wipe(S[type].main);
  for(const r of S[type].risers) wipe(r);
  for(const f of S[type].floors) wipe(f);
  for(const z of S.zones) wipe(z);
  if(n) persist();
  return n;
}
function runUpsize(){
  const n=solvePressureUpsize('cw');
  renderAll();
  alert(n?`잔압을 만족하도록 ${n}단계 상향했습니다.\n각 구간의 상향 내역은 아래 표에서 확인하세요.`
         :'상향할 구간이 없습니다. (이미 만족하거나, 공급압력 자체가 부족합니다)');
}
function resetUpsize(){
  const n=clearPressureUpsize('cw');
  renderAll();
  alert(n?'상향을 모두 해제했습니다.':'해제할 상향이 없습니다.');
}

function calcAllPressurePaths(type){
  const P=S.pressure,isCW=type==='cw',isTop=S.mainLocation==='top';
  const mat=P.material,floorH=P.floorH,mainLen=P.mainLen,branchLen=P.branchLen,zoneLen=P.zoneLen||3;
  // 기준: WS-005 — 이음쇠 상당길이(등가장) 계수. 직관 실장에 곱해 부속 손실을 반영한다.
  const ff=(P.fittingFactor==null?1.3:P.fittingFactor);
  const risers=S[type].risers,floors=S[type].floors;
  const mainR=calcMainType(type);
  const mainQ=isCW?mainR.cwQ:mainR.hwQ;
  const mainD=isCW?mainR.cwPipe:mainR.hwPipe;
  const mainFriction=frictionLossKPa(mainQ,mainD,mainLen*ff,mat);
  const paths=[];

  for(const ri of risers){
    const rr=calcRiser(ri,type);
    const riserQ=isCW?rr.cwQ:rr.hwQ;
    const riserD=isCW?rr.cwPipe:rr.hwPipe;
    const riFloors=ri.floorIds.map(fid=>floors.find(f=>f.id===fid)).filter(Boolean);

    for(let fi=0;fi<riFloors.length;fi++){
      const fl=riFloors[fi];
      const flR=calcFloor(fl,type);
      const flQ=isCW?flR.cwQ:flR.hwQ;
      const flD=isCW?flR.cwPipe:flR.hwPipe;
      // Elevation: isTop=true → going down (gain), isTop=false → going up (loss)
      const elevFloors=isTop?(fi+1):(riFloors.length-fi);
      const elevM=elevFloors*floorH;
      const rawElev=elevLossKPa(elevM);
      const elevLoss=isTop?-rawElev:rawElev;
      const riserFriction=frictionLossKPa(riserQ,riserD,elevM*ff,mat);
      const branchFriction=frictionLossKPa(flQ,flD,branchLen*ff,mat);

      const flZones=fl.zoneIds.map(zid=>S.zones.find(z=>z.id===zid)).filter(Boolean);
      for(const z of flZones){
        const zr=calcZone(z);
        const zQ=isCW?zr.cwQ:zr.hwQ;
        const zD=isCW?zr.cwPipe:zr.hwPipe;
        if(!zQ||!zD)continue;
        const zoneFriction=frictionLossKPa(zQ,zD,zoneLen*ff,mat);
        const totalLoss=mainFriction+riserFriction+branchFriction+zoneFriction+elevLoss;
        paths.push({
          label:`${ri.name} → ${fl.name} → ${z.name}`,
          ids:{r:ri.id,f:fl.id,z:z.id},
          segments:[
            {name:'MAIN관',Q:mainQ,D:mainD,L:mainLen,friction:mainFriction,elev:0},
            {name:ri.name+' 수직',Q:riserQ,D:riserD,L:elevM,friction:riserFriction,elev:elevLoss},
            {name:fl.name+' 분기',Q:flQ,D:flD,L:branchLen,friction:branchFriction,elev:0},
            {name:z.name,Q:zQ,D:zD,L:zoneLen,friction:zoneFriction,elev:0}
          ],
          totalLoss,residual:P.supplyKPa-totalLoss,
        reqKPa:Math.max(zr.mKPa||0,P.minResidualKPa||0),
        ok:(P.supplyKPa-totalLoss)>=Math.max(zr.mKPa||0,P.minResidualKPa||0)
        });
      }
    }

    // Direct zones (no floor)
    for(const zid of ri.zoneIds){
      const z=S.zones.find(z=>z.id===zid);if(!z)continue;
      const zr=calcZone(z);
      const zQ=isCW?zr.cwQ:zr.hwQ;
      const zD=isCW?zr.cwPipe:zr.hwPipe;
      if(!zQ||!zD)continue;
      const elevM=floorH;
      const elevLoss=isTop?-elevLossKPa(elevM):elevLossKPa(elevM);
      const riserFriction=frictionLossKPa(riserQ,riserD,elevM*ff,mat);
      const zoneFriction=frictionLossKPa(zQ,zD,zoneLen*ff,mat);
      const totalLoss=mainFriction+riserFriction+zoneFriction+elevLoss;
      paths.push({
        label:`${ri.name} → ${z.name}`,
        ids:{r:ri.id,z:z.id},
        segments:[
          {name:'MAIN관',Q:mainQ,D:mainD,L:mainLen,friction:mainFriction,elev:0},
          {name:ri.name+' 수직',Q:riserQ,D:riserD,L:elevM,friction:riserFriction,elev:elevLoss},
          {name:z.name,Q:zQ,D:zD,L:zoneLen,friction:zoneFriction,elev:0}
        ],
        totalLoss,residual:P.supplyKPa-totalLoss,
        reqKPa:Math.max(zr.mKPa||0,P.minResidualKPa||0),
        ok:(P.supplyKPa-totalLoss)>=Math.max(zr.mKPa||0,P.minResidualKPa||0)
      });
    }
  }
  // 메인 직결 층 (입상관 없이 메인에서 바로 분기)
  for(const fid of S[type].main.floorIds){
    const fl=floors.find(f=>f.id===fid);if(!fl)continue;
    const flR=calcFloor(fl,type);
    const flQ=isCW?flR.cwQ:flR.hwQ;
    const flD=isCW?flR.cwPipe:flR.hwPipe;
    if(!flQ||!flD)continue;
    const elevM=floorH;
    const elevLoss=isTop?-elevLossKPa(elevM):elevLossKPa(elevM);
    const branchFriction=frictionLossKPa(flQ,flD,branchLen*ff,mat);
    for(const zid of fl.zoneIds){
      const z=S.zones.find(z=>z.id===zid);if(!z)continue;
      const zr=calcZone(z);
      const zQ=isCW?zr.cwQ:zr.hwQ, zD=isCW?zr.cwPipe:zr.hwPipe;
      if(!zQ||!zD)continue;
      const zoneFriction=frictionLossKPa(zQ,zD,zoneLen*ff,mat);
      const totalLoss=mainFriction+branchFriction+zoneFriction+elevLoss;
      paths.push({
        label:`MAIN → ${fl.name} → ${z.name}`,
        ids:{f:fl.id,z:z.id},
        segments:[
          {name:'MAIN관',Q:mainQ,D:mainD,L:mainLen,friction:mainFriction,elev:elevLoss},
          {name:fl.name+' 분기',Q:flQ,D:flD,L:branchLen,friction:branchFriction,elev:0},
          {name:z.name,Q:zQ,D:zD,L:zoneLen,friction:zoneFriction,elev:0}
        ],
        totalLoss,residual:P.supplyKPa-totalLoss,
        reqKPa:Math.max(zr.mKPa||0,P.minResidualKPa||0),
        ok:(P.supplyKPa-totalLoss)>=Math.max(zr.mKPa||0,P.minResidualKPa||0)
      });
    }
  }
  // 메인 직결 존
  for(const zid of S[type].main.zoneIds){
    const z=S.zones.find(z=>z.id===zid);if(!z)continue;
    const zr=calcZone(z);
    const zQ=isCW?zr.cwQ:zr.hwQ, zD=isCW?zr.cwPipe:zr.hwPipe;
    if(!zQ||!zD)continue;
    const elevM=floorH;
    const elevLoss=isTop?-elevLossKPa(elevM):elevLossKPa(elevM);
    const zoneFriction=frictionLossKPa(zQ,zD,zoneLen*ff,mat);
    const totalLoss=mainFriction+zoneFriction+elevLoss;
    paths.push({
      label:`MAIN → ${z.name}`,
      ids:{z:z.id},
      segments:[
        {name:'MAIN관',Q:mainQ,D:mainD,L:mainLen,friction:mainFriction,elev:elevLoss},
        {name:z.name,Q:zQ,D:zD,L:zoneLen,friction:zoneFriction,elev:0}
      ],
      totalLoss,residual:P.supplyKPa-totalLoss,
      reqKPa:Math.max(zr.mKPa||0,P.minResidualKPa||0),
      ok:(P.supplyKPa-totalLoss)>=Math.max(zr.mKPa||0,P.minResidualKPa||0)
    });
  }
  paths.sort((a,b)=>a.residual-b.residual);
  return paths;
}

function renderPressurePathResult(paths,type,isCW){
  const P=S.pressure;
  if(!paths.length)return`<div class="empty">계산 가능한 경로 없음 (입상관·층·화장실 설정 필요)</div>`;
  const critical=paths[0];
  const critColor=critical.ok?'var(--accent2)':'var(--red)';
  let h=`<div style="background:var(--surface2);border:1.5px solid ${critColor};border-radius:8px;padding:12px;margin-bottom:16px">
    <div style="font-size:10px;color:var(--text2);margin-bottom:4px">임계경로 (최소 잔압)</div>
    <div style="font-size:12px;font-weight:700;color:${critColor};margin-bottom:10px">${critical.ok?'✓':'⚠'} ${critical.label}</div>
    <table style="width:100%;font-size:10.5px;border-collapse:collapse">
      <tr style="color:var(--text3)">
        <td style="padding:2px 5px">구간</td><td style="padding:2px 5px;text-align:center">관경</td>
        <td style="padding:2px 5px;text-align:right">마찰손실</td><td style="padding:2px 5px;text-align:right">위치수두</td><td style="padding:2px 5px;text-align:right">잔압</td>
      </tr>
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:2px 5px;color:var(--accent)">공급압력</td><td></td><td></td><td></td>
        <td style="padding:2px 5px;text-align:right;color:var(--accent);font-weight:700">+${P.supplyKPa.toFixed(0)}</td>
      </tr>`;
  let cum=P.supplyKPa;
  for(const seg of critical.segments){
    cum-=seg.friction; cum-=seg.elev;
    const fCol=seg.friction>25?'var(--warn)':'var(--text)';
    const elvStr=seg.elev===0?'─':(seg.elev>0?`−${seg.elev.toFixed(1)}`:`+${Math.abs(seg.elev).toFixed(1)}`);
    h+=`<tr style="border-top:1px solid var(--border)">
      <td style="padding:2px 5px">${seg.name}</td>
      <td style="padding:2px 5px;text-align:center;color:var(--accent2)">${seg.D?seg.D+'A':'─'}</td>
      <td style="padding:2px 5px;text-align:right;color:${fCol}">−${seg.friction.toFixed(1)}</td>
      <td style="padding:2px 5px;text-align:right">${elvStr}</td>
      <td style="padding:2px 5px;text-align:right">${cum.toFixed(1)}</td>
    </tr>`;
  }
  const resCol=critical.ok?'var(--accent2)':'var(--red)';
  h+=`<tr style="border-top:2px solid var(--border)">
    <td colspan="4" style="padding:3px 5px;font-weight:700;font-size:11px">말단 잔압</td>
    <td style="padding:3px 5px;text-align:right;font-weight:700;font-size:13px;color:${resCol}">${critical.residual.toFixed(1)} kPa <span style="font-size:10px;color:var(--text2)">(${(critical.residual/98.0665).toFixed(2)} kgf/cm²)</span></td>
  </tr>
  <tr><td colspan="5" style="padding:1px 5px;font-size:10px;color:${resCol}">${critical.ok?`✓ 필요압력 ${critical.reqKPa}kPa 충족`:`⚠ 필요압력 ${critical.reqKPa}kPa 미달 — 관경 상향 필요`}</td></tr>
  </table>
  <div style="font-size:10px;color:var(--text3);margin-top:6px;text-align:right">단위: kPa · 이음쇠 등가장 ×${(P.fittingFactor??1.3).toFixed(2)} 반영 · 필요압력은 KDS 31 30 15 표 4.3-1</div>
  </div>`;

  // All paths summary
  h+=`<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px">전체 경로 잔압</div>
  <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">`;
  for(const p of paths){
    const pc=p.ok?'var(--accent2)':'var(--red)';
    const pb=p.ok?'rgba(56,201,160,0.06)':'rgba(224,92,92,0.08)';
    const bar=Math.max(0,Math.min(100,(p.residual/P.supplyKPa)*100));
    const minBar=Math.max(0,Math.min(100,(P.minResidualKPa/P.supplyKPa)*100));
    h+=`<div style="background:${pb};border:1px solid ${pc};border-radius:5px;padding:5px 8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:10.5px">${p.label}</span>
        <span style="font-size:11px;font-weight:700;color:${pc}">${p.residual.toFixed(0)} kPa ${p.ok?'✓':'⚠'}</span>
      </div>
      <div style="position:relative;height:5px;background:var(--surface2);border-radius:3px">
        <div style="height:100%;width:${bar}%;background:${pc};border-radius:3px"></div>
        <div style="position:absolute;top:-1px;left:${minBar}%;width:1.5px;height:7px;background:var(--warn);border-radius:1px" title="최소기준 ${P.minResidualKPa}kPa"></div>
      </div>
    </div>`;
  }
  h+=`</div>`;

  // Upsize suggestions
  const failed=paths.filter(p=>!p.ok);
  if(failed.length){
    h+=`<div class="section" style="border-color:var(--warn);margin-bottom:0">
    <div class="section-title" style="color:var(--warn)">⚠ 업사이즈 권장</div>`;
    const seen=new Set();
    for(const p of failed){
      const worst=p.segments.reduce((a,b)=>a.friction>b.friction?a:b);
      const key=worst.name+'_'+worst.D;
      if(!seen.has(key)){
        seen.add(key);
        h+=`<div style="font-size:11px;padding:5px 0;border-bottom:1px solid var(--border)">
          <b>${worst.name}</b>: <span style="color:var(--red)">${worst.D}A</span> → <span style="color:var(--accent2)">${pipeNextSize(worst.D)}A</span>
          <span style="font-size:10px;color:var(--text3);margin-left:6px">마찰손실 ${worst.friction.toFixed(1)} kPa (최대 구간)</span>
        </div>`;
      }
    }
    h+=`</div>`;
  }
  return h;
}

        const elevFloors=isTop?(fi+1):(riFloors.length-fi);
        const elevM=elevFloors*P.floorH;
        const elevLoss=isTop?-elevLossKPa(elevM):elevLossKPa(elevM);
        const riserFriction=frictionLossKPa(riserQ,riserD,elevM*ff,mat);
        const branchFriction=frictionLossKPa(flQ,flD,P.branchLen*ff,mat);
        const flZones=fl.zoneIds.map(zid=>S.zones.find(z=>z.id===zid)).filter(Boolean).filter(z=>!z.elecHW);
        for(const z of flZones){
          const zr=calcZone(z);
          const zQ=zr.hwQ,zD=zr.hwPipe;
          if(!zQ||!zD)continue;
          const zoneFriction=frictionLossKPa(zQ,zD,zoneLen*ff,mat);
          const totalLoss=mainFriction+riserFriction+branchFriction+zoneFriction+elevLoss;
          hwPathsReal.push({
            label:`${ri.name} → ${fl.name} → ${z.name}`,
            segments:[
              {name:'MAIN관(급탕)',Q:mainQ,D:mainD,L:P.mainLen,friction:mainFriction,elev:0},
              {name:ri.name+' 수직',Q:riserQ,D:riserD,L:elevM,friction:riserFriction,elev:elevLoss},
              {name:fl.name+' 분기',Q:flQ,D:flD,L:P.branchLen,friction:branchFriction,elev:0},
              {name:z.name,Q:zQ,D:zD,L:zoneLen,friction:zoneFriction,elev:0}
            ],
            totalLoss,residual:P.supplyKPa-totalLoss,
        reqKPa:Math.max(zr.mKPa||0,P.minResidualKPa||0),
        ok:(P.supplyKPa-totalLoss)>=Math.max(zr.mKPa||0,P.minResidualKPa||0)
          });
        }
      }
    }
    hwPathsReal.sort((a,b)=>a.residual-b.residual);
  }
  if(hwPathsReal.length){
    h+=renderPressurePathResult(hwPathsReal,'cw',false);
  } else {
    h+=`<div class="empty">급탕 배관이 없거나 (모든 화장실 개별전기온수기) 탭 ②에서 입상관 설정 필요</div>`;
  }
  h+=`</div></div></div>`;
  el.innerHTML=h;
}

// Render zone pipe tree as clean print SVG
function zonePrintSVG(z){
  const nodes=z.pipe.nodes, rootId=z.pipe.rootId;
  if(!rootId||!nodes[rootId])return'';
  const NW=88,NH=38,HGAP=18,VGAP=10;
  const pos={};
  // Calculate subtree width
  function subW(id){
    if(!id||!nodes[id])return 0;
    const n=nodes[id];
    const mw=Math.max(NW,subW(n.mainNext));
    const bw=n.branchNext?(HGAP+subW(n.branchNext)):0;
    return mw+bw;
  }
  // Layout: mainNext goes below, branchNext to the right at same next-row Y
  function layout(id,x,y){
    if(!id||!nodes[id])return;
    const n=nodes[id];
    pos[id]={x,y,n};
    const cy=y+NH+VGAP;
    if(n.mainNext) layout(n.mainNext,x,cy);
    if(n.branchNext) layout(n.branchNext,x+Math.max(NW,subW(n.mainNext))+HGAP,cy);
  }
  layout(rootId,4,4);
  // Bounding box
  let maxX=0,maxY=0;
  for(const id of Object.keys(pos)){maxX=Math.max(maxX,pos[id].x+NW);maxY=Math.max(maxY,pos[id].y+NH);}
  const W=maxX+4,H=maxY+4;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:Malgun Gothic,sans-serif;display:block">`;
  // Draw connections
  for(const id of Object.keys(pos)){
    const {x,y,n}=pos[id];
    if(n.mainNext&&pos[n.mainNext]){
      const cp=pos[n.mainNext];
      s+=`<line x1="${x+NW/2}" y1="${y+NH}" x2="${cp.x+NW/2}" y2="${cp.y}" stroke="#1a2a6c" stroke-width="1.5"/>`;
    }
    if(n.branchNext&&pos[n.branchNext]){
      const bp=pos[n.branchNext];
      const jx=bp.x+NW/2, jy=y+NH+VGAP/2;
      s+=`<polyline points="${x+NW/2},${y+NH} ${x+NW/2},${jy} ${jx},${jy} ${jx},${bp.y}" fill="none" stroke="#1a2a6c" stroke-width="1.2" stroke-dasharray="4,2"/>`;
    }
  }
  // Draw nodes
  for(const id of Object.keys(pos)){
    const {x,y,n}=pos[id];
    const isStart=n.type==='start';
    const fill=isStart?'#e8edf8':'#f4f6fb';
    const stroke=isStart?'#1a2a6c':'#7a90c4';
    const sw=isStart?1.5:1;
    s+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    if(isStart){
      s+=`<text x="${x+NW/2}" y="${y+NH/2+4}" text-anchor="middle" font-size="9" font-weight="700" fill="#1a2a6c">메인관 시작</text>`;
    } else if(n.type==='fixture'&&n.fxKey&&FX[n.fxKey]){
      const fx=FX[n.fxKey];
      // Calc pipe for this single node qty
      const cwPipe=flowPipe(fx.cwQ*(n.qty||1));
      const hwPipe=fx.hot?flowPipe(fx.cwQ*(n.qty||1)):0;
      const sewPipeD=fx.drain==='sew'?Math.max(sewPipe(fx.dfu*(n.qty||1)),100):0;
      const wstPipeD=fx.drain==='wst'?Math.max(wstPipe(fx.dfu*(n.qty||1)),50):0;
      s+=`<text x="${x+NW/2}" y="${y+11}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1a2a6c">${fx.name}</text>`;
      s+=`<text x="${x+NW/2}" y="${y+21}" text-anchor="middle" font-size="7" fill="#444">${n.qty||1}개</text>`;
      // Pipe tags
      const tags=[];
      if(cwPipe) tags.push({c:'#1a56c4',t:'급수 '+cwPipe+'A'});
      if(hwPipe) tags.push({c:'#c41a1a',t:'급탕 '+hwPipe+'A'});
      if(sewPipeD) tags.push({c:'#b52b2b',t:'오수 '+sewPipeD+'A'});
      if(wstPipeD) tags.push({c:'#6b3ac4',t:'배수 '+wstPipeD+'A'});
      const tw=NW/(tags.length||1);
      tags.forEach((tg,i)=>{
        s+=`<text x="${x+tw*i+tw/2}" y="${y+33}" text-anchor="middle" font-size="6.5" font-weight="600" fill="${tg.c}">${tg.t}</text>`;
      });
    }
  }
  s+=`</svg>`;
  return s;
}

function printPDF(){
  try{ _printPDF(); } catch(e){ alert('PDF 생성 오류: '+e.message+'\n\n'+e.stack); }
}
function _printPDF(){
  const proj=document.getElementById('projectName').value||'위생배관 관경 계산서';
  const today=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});

  const css=`
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:8pt;color:#111;background:#fff}
    @page{size:A4 landscape;margin:10mm 12mm 10mm 12mm}
    .page{width:100%;min-height:0;page-break-after:always}
    .page:last-child{page-break-after:avoid}
    h1{font-size:12pt;font-weight:700;color:#1a2a6c}
    .header-bar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1a2a6c;padding-bottom:2mm;margin-bottom:3mm}
    .project-info{font-size:7.5pt;color:#555;text-align:right}
    .basis-box{background:#f4f6fb;border:1px solid #c8d0e8;border-radius:3px;padding:1.5mm 3mm;margin-bottom:3mm;font-size:7pt;line-height:1.5}
    .basis-box b{color:#1a2a6c}
    .body-row{display:flex;gap:5mm;align-items:flex-start}
    .diagram-col{flex:0 0 auto;min-width:80px}
    .data-col{flex:1;min-width:0}
    table{width:100%;border-collapse:collapse;font-size:7.5pt;margin-bottom:2.5mm}
    th{background:#1a2a6c;color:#fff;padding:1.5mm 2mm;text-align:center;font-weight:600;font-size:7pt}
    td{padding:1.2mm 2mm;border:1px solid #ccc;text-align:center;vertical-align:middle}
    tr:nth-child(even) td{background:#f8f9fd}
    .result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;margin-bottom:2mm}
    .result-card{border:1.5px solid #c8d0e8;border-radius:3px;padding:2mm;text-align:center}
    .result-card .lbl{font-size:7pt;color:#555;margin-bottom:0.5mm}
    .result-card .val{font-size:13pt;font-weight:700;line-height:1.2}
    .result-card .sub{font-size:6.5pt;color:#777;margin-top:0.5mm}
    .cw-color{color:#1a56c4}.hw-color{color:#c41a1a}.sew-color{color:#b52b2b}.wst-color{color:#6b3ac4}
    .note-box{background:#fffbe6;border:1px solid #e8c84a;border-radius:3px;padding:1.5mm 3mm;font-size:6.5pt;color:#555;line-height:1.5}
    .tag-elecHW{font-size:6.5pt;color:#c41a1a;background:#fff0f0;border:1px solid #f7c5c5;border-radius:2px;padding:0 1.5mm;margin-left:2mm}
    .section-label{font-size:7.5pt;font-weight:700;color:#1a2a6c;margin-bottom:1mm;padding-bottom:0.5mm;border-bottom:1px solid #c8d0e8}
    .footer{font-size:6.5pt;color:#aaa;text-align:right;margin-top:2mm}
    .schematic-page svg{width:100% !important;height:auto !important;max-height:145mm}
    .main-sum{display:flex;gap:3mm;margin-bottom:3mm}
    .main-sum .result-card{flex:1}
  `;

  function row(cells,isHead=false){
    return '<tr>'+cells.map(c=>isHead?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>';
  }
  function hdr(title,sub){
    return `<div class="header-bar">
      <div><h1>${title}</h1>${sub?`<div style="font-size:8pt;color:#555;margin-top:1mm">${sub}</div>`:''}</div>
      <div class="project-info"><b>${proj}</b><br>${today}</div>
    </div>`;
  }
  function basis(){
    const sm=S.cwSimultMode==='legacy'
      ? '<b>고정 0.85</b> (MAIN 단계만)'
      : '<b>동시사용계수표</b> (공조위생 기술데이터북) — 화장실·층·입상관·MAIN 각 단계 적용';
    return `<div class="basis-box"><b>산정 기준</b> |
      급수·급탕: <b>기구 순간유량 합산 → 동시사용계수 적용 → 유량 구간표</b>로 관경 결정
      (구간표는 마찰손실 기준, 약 19~29 mmAq/m). 추가로 <b>허용유속 ${S.cwVmax||1.5} m/s</b> 검사를 걸어
      초과 시 한 단계 상향 (내경은 KS D 3507 배관용탄소강관 기준).
      동시사용계수 ${sm} |
      오배수: <b>기구배수부하단위(DFU) 합계</b>로 관경 결정 (KDS 31 30 25 배수통기설비, 4.1.4·4.1.5).
      DFU 는 사용빈도·동시사용 확률이 이미 반영된 단위이므로 <b>동시사용률을 별도로 곱하지 않음</b>.
      층별 횡주관은 <b>표 4.1-5 수평지관</b>, 입상관은 <b>표 4.1-5 수직관</b>(합계 + 1개 분기층당 동시 만족),
      건물배수 수평주관은 <b>표 4.1-4</b> 구배 <b>${DR_SLOPES[S.drSlope==null?1:S.drSlope]}</b> 기준.
      오수관 최소 100A, 잡배수관 최소 50A, 상류관경은 하류 최대관경 이상 |
      통기: DFU 개략표 + 담당 배수관경의 1/2 이상, 최소 32A |
      압력손실: <b>Hazen-Williams</b> (PVC C=150, 동관 C=130, STS C=140),
      이음쇠 등가장 <b>×${(S.pressure.fittingFactor??1.3).toFixed(2)}</b> |
      말단 필요압력: <b>KDS 31 30 15 표 4.3-1</b> 기구별 값 적용
      (세정밸브 100 · 샤워 70 · 그 외 55 kPa). 잔압 미달 시 관경을 상향해 재계산
    </div>`;
  }
  function footer(){
    return `<div class="footer">※ 본 계산서는 자동 산정 참고용입니다. 최종 설계 적용 전 담당 기술사의 검토를 받으시기 바랍니다.</div>`;
  }

  let pages='';

  // ── 화장실별 페이지 ──
  for(const z of S.zones){
    const t=zoneFxTotals(z);
    const r=calcZone(z);
    if(!FX_KEYS.some(k=>t[k]>0)) continue;

    const diagramSVG=zonePrintSVG(z);

    const fxRows=FX_KEYS.filter(k=>t[k]>0).map(k=>{
      const f=FX[k],n=t[k];
      return row([f.name, n,
        f.cwQ+' L/min', (f.cwQ*n).toFixed(1)+' L/min',
        f.hot?'○':'─', f.hot?(f.cwQ*n).toFixed(1)+' L/min':'─',
        f.drain==='sew'?f.dfu*n:'─', f.drain==='wst'?f.dfu*n:'─',
        f.dc+'A']);
    }).join('');

    pages+=`<div class="page">
      ${hdr('화장실 위생배관 관경 산정서',
        (z.floor?z.floor+' / ':'')+' 화장실: <b>'+z.name+'</b>'+(z.elecHW?' <span class="tag-elecHW">개별전기온수기</span>':''))}
      ${basis()}
      <div class="body-row">
        <div class="diagram-col">
          <div class="section-label" style="margin-bottom:2mm">배관 계통</div>
          ${diagramSVG}
        </div>
        <div class="data-col">
          <div class="section-label">기구 현황 및 부하 산정</div>
          <table>
            ${row(['기구명','수량','기구급수량','급수합계','온수','급탕합계','오수DFU','배수DFU','최소관경'],true)}
            ${fxRows}
            ${row(['<b>합 계</b>','─','─',`<b>${r.cwQ.toFixed(1)} L/min</b>`,'─',
              r.hwQ>0?`<b>${r.hwQ.toFixed(1)} L/min</b>`:'─',
              r.sewDFU>0?`<b>${r.sewDFU}</b>`:'─',
              r.wstDFU>0?`<b>${r.wstDFU}</b>`:'─','─'])}
          </table>
          <div class="section-label">관경 산정 결과</div>
          <div class="result-grid">
            <div class="result-card"><div class="lbl">급수관</div>
              <div class="val cw-color">${r.cwPipe?r.cwPipe+'A':'N/A'}</div>
              <div class="sub">${r.cwQ.toFixed(1)} L/min</div></div>
            <div class="result-card"><div class="lbl">급탕관</div>
              <div class="val hw-color">${z.elecHW?'개별':(r.hwPipe?r.hwPipe+'A':'N/A')}</div>
              <div class="sub">${z.elecHW?'온수기 사용':r.hwQ>0?r.hwQ.toFixed(1)+' L/min':'없음'}</div></div>
            <div class="result-card"><div class="lbl">오수관</div>
              <div class="val sew-color">${r.sewPipe?r.sewPipe+'A':'N/A'}</div>
              <div class="sub">${r.sewDFU>0?'DFU '+r.sewDFU:'없음'}</div></div>
            <div class="result-card"><div class="lbl">배수관</div>
              <div class="val wst-color">${r.wstPipe?r.wstPipe+'A':'N/A'}</div>
              <div class="sub">${r.wstDFU>0?'DFU '+r.wstDFU:'없음'}</div></div>
          </div>
          <div class="note-box">
            ※ Hunter 곡선 적용 후 기구 최소 연결관경(KS B 6301)과 비교하여 큰 값 결정 &nbsp;|&nbsp;
            오수관 최소 100A, 배수관 최소 50A 적용
          </div>
        </div>
      </div>
      ${footer()}
    </div>`;
  }

  // ── 급수/급탕 계통도 (1페이지) ──
  const cm=calcMainType('cw');
  const cwSvgRaw=schematicSVG('cw');
  // Remove outer div wrapper, strip explicit width/height to let CSS scale it
  const cwSvgScaled=cwSvgRaw
    .replace(/<div[^>]*>/g,'').replace(/<\/div>/g,'')
    .replace(/(<svg)([^>]*)(>)/,(m,a,b,c)=>{
      const vb=b.match(/viewBox="([^"]+)"/);
      const vbAttr=vb?`viewBox="${vb[1]}"`:(()=>{
        const w=b.match(/width="(\d+)"/),h=b.match(/height="(\d+)"/);
        return w&&h?`viewBox="0 0 ${w[1]} ${h[1]}"`:'';
      })();
      return `${a} xmlns="http://www.w3.org/2000/svg" ${vbAttr} preserveAspectRatio="xMidYMid meet"${c}`;
    }).trim();

  pages+=`<div class="page">
    ${hdr('급수·급탕 계통도')}
    ${basis()}
    <div class="main-sum">
      <div class="result-card"><div class="lbl">급수 MAIN관</div><div class="val cw-color">${cm.cwPipe?cm.cwPipe+'A':'N/A'}</div><div class="sub">${cm.cwQ.toFixed(1)} L/min (동시사용계수 ${((cm.cwSimultF||1)*100).toFixed(1)}% 적용 후)</div></div>
      <div class="result-card"><div class="lbl">급탕 MAIN관</div><div class="val hw-color">${cm.hwPipe?cm.hwPipe+'A':'N/A'}</div><div class="sub">${cm.hwQ.toFixed(1)} L/min (동시사용계수 ${((cm.hwSimultF||1)*100).toFixed(1)}% 적용 후)</div></div>
    </div>
    <div class="schematic-page">${cwSvgScaled}</div>
    ${footer()}
  </div>`;

  // ── 오배수 계통도 (1페이지) ──
  const dm=calcMainType('dr');
  const drSvgRaw=schematicSVG('dr');
  const drSvgScaled=drSvgRaw
    .replace(/<div[^>]*>/g,'').replace(/<\/div>/g,'')
    .replace(/(<svg)([^>]*)(>)/,(m,a,b,c)=>{
      const vb=b.match(/viewBox="([^"]+)"/);
      const vbAttr=vb?`viewBox="${vb[1]}"`:(()=>{
        const w=b.match(/width="(\d+)"/),h=b.match(/height="(\d+)"/);
        return w&&h?`viewBox="0 0 ${w[1]} ${h[1]}"`:'';
      })();
      return `${a} xmlns="http://www.w3.org/2000/svg" ${vbAttr} preserveAspectRatio="xMidYMid meet"${c}`;
    }).trim();

  pages+=`<div class="page">
    ${hdr('오배수 계통도')}
    ${basis()}
    <div class="main-sum">
      <div class="result-card"><div class="lbl">오수 MAIN관</div><div class="val sew-color">${dm.sewPipe?dm.sewPipe+'A':'N/A'}</div><div class="sub">DFU: ${dm.sewDFU.toFixed(0)}</div></div>
      <div class="result-card"><div class="lbl">배수 MAIN관</div><div class="val wst-color">${dm.wstPipe?dm.wstPipe+'A':'N/A'}</div><div class="sub">DFU: ${dm.wstDFU.toFixed(0)}</div></div>
    </div>
    <div class="schematic-page">${drSvgScaled}</div>
    ${footer()}
  </div>`;

  const win=window.open('','_blank','width=1200,height=900');
  if(!win){ alert('팝업이 차단됐습니다.\n브라우저 주소창 오른쪽 팝업 차단 아이콘을 클릭해 허용 후 다시 시도하세요.'); return; }
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>${proj} — 위생배관 관경 계산서</title>
    <style>${css}</style></head>
  <body>${pages}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(),700);
}
</script>
